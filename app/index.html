<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Sayfa kendi açık/koyu temasını (data-theme) zaten yönetiyor - bu meta
     olmadan Android WebView (özellikle sistem koyu modundayken) sayfayı
     kendi algoritmasıyla otomatik karartıp uygulamanın gerçek renklerini
     bozuyordu; "koyu/açık tema çalışmıyor" şikayetinin asıl sebebi buydu. -->
<meta name="color-scheme" content="light dark">
<title>Peyktan</title>
<link rel="icon" type="image/png" href="/assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  // Sayfa boyanmadan önce doğru temayı uygula (yanıp sönmeyi önler)
  (function(){
    try{
      var t = localStorage.getItem('rys_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  })();
</script>
</head>
<body>
<div id="splashScreen" class="splash-screen">
  <img src="/assets/images/logo.webp" alt="Peyktan" class="splash-logo">
  <div class="splash-name">PEYKTAN</div>
  <div class="splash-sub">Restaurant Management System</div>
</div>
<div id="loadingOverlay" class="splash-screen">
  <img src="/assets/images/logo.webp" alt="Peyktan" class="splash-logo">
</div>
<div id="app"></div>
<div id="printArea"></div>
<!-- Bu script eskiden <head>'de idi ve sayfanın hiçbir şeyini (açılış
     ekranı dahil) boyayamadan önce dış (jsdelivr) bir dosyayı indirip
     çalıştırmasını bekletiyordu - "giriş ekranı geç geliyor" şikayetinin
     asıl sebebi buydu. Burada, gerçekten ihtiyaç duyulduğu satırın hemen
     öncesinde olduğu için tarayıcı önce yukarıdaki tüm HTML/CSS'i
     (açılış ekranı dahil) boyar, ancak SONRA bu script için bekler. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/financial.js"></script>
<script src="js/reservations.js"></script>
<script src="js/crm.js"></script>
<script src="js/supplier.js"></script>
<script src="js/admin-panel.js"></script>
<script src="js/settings.js"></script>
<script src="js/pos-kitchen.js"></script>
<script src="js/pos-payments.js"></script>
<script src="js/pos-packages.js"></script>
<script src="js/pos-printer.js"></script>
<script src="js/pos-push.js"></script>
<script src="js/pos-escpos.js"></script>
<script src="js/messages.js"></script>
<script src="js/auth-screens.js"></script>
<script src="js/main.js"></script>
</body>
</html>
