<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Sayfa kendi açık/koyu temasını (data-theme) zaten yönetiyor - bu meta
     olmadan Android WebView (özellikle sistem koyu modundayken) sayfayı
     kendi algoritmasıyla otomatik karartıp uygulamanın gerçek renklerini
     bozuyordu; "koyu/açık tema çalışmıyor" şikayetinin asıl sebebi buydu. -->
<meta name="color-scheme" content="light dark">
<title>Peyktan</title>
<link rel="icon" type="image/png" href="/assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  // Sayfa boyanmadan önce doğru temayı uygula (yanıp sönmeyi önler)
  (function(){
    try{
      var t = localStorage.getItem('rys_theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  })();
</script>
</head>
<body>
<div id="splashScreen" class="splash-screen">
  <img src="/assets/images/logo.webp" alt="Peyktan" class="splash-logo">
  <div class="splash-name">PEYKTAN</div>
  <div class="splash-sub">Restaurant Management System</div>
</div>
<div id="loadingOverlay" class="splash-screen">
  <img src="/assets/images/logo.webp" alt="Peyktan" class="splash-logo">
</div>
<div id="app"></div>
<div id="printArea"></div>
<!-- Bu script eskiden <head>'de idi ve sayfanın hiçbir şeyini (açılış
     ekranı dahil) boyayamadan önce dış (jsdelivr) bir dosyayı indirip
     çalıştırmasını bekletiyordu - "giriş ekranı geç geliyor" şikayetinin
     asıl sebebi buydu. Burada, gerçekten ihtiyaç duyulduğu satırın hemen
     öncesinde olduğu için tarayıcı önce yukarıdaki tüm HTML/CSS'i
     (açılış ekranı dahil) boyar, ancak SONRA bu script için bekler. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/financial.js"></script>
<script src="js/reservations.js"></script>
<script src="js/crm.js"></script>
<script src="js/supplier.js"></script>
<script>
function render(){
  if(isAdminMode()){ renderAdminArea(); return; }

  const app = document.getElementById('app');
  const session = getSession();
  if(!session){
    const companySession = getCompanySession();
    if(companySession){ renderCompanyPanel(app, companySession); return; }
    if(APP.authScreen==='signup') renderSignupScreen(app);
    else if(APP.authScreen==='expired') renderExpiredScreen(app);
    else if(APP.authScreen==='forgot') renderForgotPasswordScreen(app);
    else if(APP.authScreen==='companyLogin') renderCompanyLoginScreen(app);
    else renderLoginScreen(app);
    return;
  }

  if(!APP.customerReqPollStarted){
    APP.customerReqPollStarted = true;
    startCustomerRequestPolling(session);
    maybeShowPushPrompt(session);
    refreshShiftWidget(session);
  }
  const theme = getTheme();
  const collapsed = getSidebarCollapsed();
  const items = NAV_ITEMS.filter(i => navItemVisible(i, session));
  app.innerHTML = `
    <div class="app-shell">
      <div class="mobile-topbar">
        <button class="mobile-menu-btn" onclick="toggleMobileNav()" aria-label="Menü">☰</button>
        <img src="/assets/images/logo.webp" alt="Peyktan" class="mobile-topbar-logo">
        <div class="mobile-topbar-title">${escapeHtml(session.restaurant_name)}</div>
      </div>
      <div class="sidebar-backdrop ${APP.mobileNavOpen?'show':''}" onclick="closeMobileNav()"></div>
      <aside class="sidebar ${collapsed?'collapsed':''} ${APP.mobileNavOpen?'mobile-open':''}">
        <div class="app-brand-row"><img src="/assets/images/logo.webp" alt="Peyktan" class="app-brand-logo"><span class="app-brand-text">Peyktan</span></div>
        <div class="sb-top">
          <div class="sb-brand" onclick="goHome()"><span class="label">${escapeHtml(session.restaurant_name)}</span></div>
          <button class="sb-collapse-btn" onclick="toggleSidebar()" title="Menüyü daralt/genişlet">${collapsed?'»':'«'}</button>
          <button class="sb-mobile-close" onclick="closeMobileNav()" aria-label="Menüyü kapat">✕</button>
        </div>
        <div class="sb-user">
          <div class="name">${escapeHtml(session.username)}</div>
          <div class="role">${escapeHtml((session.role_names||[]).join(' + ') || '')}</div>
        </div>
        <nav>
          ${items.map(i => `<div class="sb-item ${APP.view===i.view?'active':''}" onclick="goToView('${i.view}')" title="${i.label}"><span class="ic">${i.icon}</span><span class="label">${i.label}</span></div>`).join('')}
        </nav>
        <div class="sb-bottom">
          <div id="shiftWidget" class="shift-widget">${shiftWidgetHtml()}</div>
          ${getCompanySession() ? '<button class="sb-logout" onclick="returnToCompanyPanel()" title="Şirket paneline dön">🏢<span class="label"> Şirkete Dön</span></button>' : ''}
          <div class="theme-toggle">
            <button class="${theme==='dark'?'active':''}" onclick="setTheme('dark')" type="button">🌙 <span class="label">Koyu</span></button>
            <button class="${theme==='light'?'active':''}" onclick="setTheme('light')" type="button">☀️ <span class="label">Açık</span></button>
          </div>
          <button class="sb-logout" onclick="doLogout()" title="Çıkış Yap">🚪<span class="label"> Çıkış Yap</span></button>
        </div>
      </aside>
      <div class="content-area"><div class="content-inner ${(APP.view==='settings'||APP.view==='reports')?'content-inner-wide':''}"><main id="main"></main></div></div>
    </div>`;
  const main = document.getElementById('main');
  if(APP.view==='home') renderHome(main, session);
  else if(APP.view==='order') renderOrderView(main, session);
  else if(APP.view==='packages') renderPackagesView(main, session);
  else if(APP.view==='kitchen') renderKitchenView(main, session);
  else if(APP.view==='payments') renderPaymentsView(main, session);
  else if(APP.view==='settings') renderSettingsView(main, session);
  else if(APP.view==='reports') renderReportsView(main, session);
  else if(APP.view==='printerSettings') renderPrinterSettingsView(main, session);
  else if(APP.view==='notificationSettings') renderNotificationSettingsView(main, session);
  else if(APP.view==='reservations') renderReservationsView(main, session);
  else if(APP.view==='crm') renderCrmView(main, session);
  else if(APP.view==='purchasing') renderPurchasingView(main, session);
}
function todayLocalDateStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function goToView(view){
  APP.view = view;
  // Finansal Analiz'e her girişte, en son baktiginiz tarihi hatirlamak yerine
  // dogrudan bugunun raporunu getirir - farkli bir tarihe bakmak isterseniz
  // ekrandaki tarih seciciden degistirebilirsiniz.
  if(view==='reports'){ APP.reportDate = todayLocalDateStr(); APP.reportDateTo = todayLocalDateStr(); }
  // Mutfak ekranindan cikinca arka plandaki yenileme/sayac calismaya devam etmesin.
  if(view!=='kitchen') stopKitchenPolling();
  if(view!=='order' && view!=='packages') stopOrderPolling();
  if(view!=='reservations') stopWaitlistTimerInterval();
  // Telefonda bir menü öğesine dokununca kayar menü otomatik kapansın.
  APP.mobileNavOpen = false;
  render();
}

/* ================= GİZLİ PLATFORM YÖNETİMİ (?admin=1) ================= */
function renderAdminArea(){
  const app = document.getElementById('app');
  const admin = getAdminSession();
  if(!admin){ renderAdminLogin(app); return; }
  const theme = getTheme();
  app.innerHTML = `
    <header class="topbar">
      <div class="brand">🔒 Platform Yönetimi</div>
      <div class="right">
        <div class="theme-toggle" style="width:150px;background:var(--panel2);border:1px solid var(--border);">
          <button class="${theme==='dark'?'active':''}" style="color:${theme==='dark'?'':'var(--muted)'};background:${theme==='dark'?'var(--accent)':'transparent'};box-shadow:none;" onclick="setTheme('dark')" type="button">🌙 Koyu</button>
          <button class="${theme==='light'?'active':''}" style="color:${theme==='light'?'':'var(--muted)'};background:${theme==='light'?'var(--accent)':'transparent'};box-shadow:none;" onclick="setTheme('light')" type="button">☀️ Açık</button>
        </div>
        <button class="ghost-btn" onclick="doAdminLogout()">Çıkış</button>
      </div>
    </header>
    <div class="content-inner content-inner-wide">
      <div class="tabs" id="adminTabs">
        <div class="tab ${(APP.adminView||'promos')==='promos'?'active':''}" data-tab="promos" onclick="setAdminView('promos')">Promosyon Kodları</div>
        <div class="tab ${APP.adminView==='pricing'?'active':''}" data-tab="pricing" onclick="setAdminView('pricing')">💳 Paket Fiyatları</div>
        <div class="tab ${APP.adminView==='restaurants'?'active':''}" data-tab="restaurants" onclick="setAdminView('restaurants')">🏬 İşletmeler</div>
        <div class="tab ${APP.adminView==='companies'?'active':''}" data-tab="companies" onclick="setAdminView('companies')">🏢 Şirketler</div>
        <div class="tab ${APP.adminView==='banktransfers'?'active':''}" data-tab="banktransfers" onclick="setAdminView('banktransfers')">🏦 Havale Bildirimleri</div>
        <div class="tab ${APP.adminView==='allfeatures'?'active':''}" data-tab="allfeatures" onclick="setAdminView('allfeatures')">🗂️ Tüm Özellikler</div>
        <div class="tab ${APP.adminView==='addons'?'active':''}" data-tab="addons" onclick="setAdminView('addons')">🧩 Eklentiler</div>
      </div>
      <main id="main"></main>
    </div>`;
  renderAdminTabContent(admin);
}
function setAdminView(v){
  APP.adminView = v;
  document.querySelectorAll('#adminTabs .tab').forEach(t => t.classList.toggle('active', t.dataset.tab===v));
  renderAdminTabContent(getAdminSession());
}
function renderAdminTabContent(admin){
  const main = document.getElementById('main');
  if((APP.adminView||'promos')==='pricing') renderPricingAdmin(main, admin);
  else if(APP.adminView==='restaurants') renderRestaurantsAdmin(main, admin);
  else if(APP.adminView==='companies') renderCompaniesAdmin(main, admin);
  else if(APP.adminView==='banktransfers') renderBankTransfersAdmin(main, admin);
  else if(APP.adminView==='allfeatures') renderFeatureCatalogAdmin(main, admin);
  else if(APP.adminView==='addons') renderAddonsAdmin(main, admin);
  else renderPromoAdmin(main, admin);
}
function renderAdminLogin(app){
  app.innerHTML = `<div class="center-wrap"><div class="box">
    <h1>Platform Yönetimi</h1>
    <p class="muted">Bu alan sadece size özeldir.</p>
    <input id="adminUser" placeholder="Kullanıcı adı" autocapitalize="none">
    <input id="adminPass" type="password" placeholder="Şifre">
    <button onclick="doAdminLogin()" id="adminLoginBtn">Giriş Yap</button>
    <div class="error" id="adminErr"></div>
  </div></div>`;
}
async function doAdminLogin(){
  const errBox = document.getElementById('adminErr');
  errBox.textContent = '';
  const u = document.getElementById('adminUser').value.trim();
  const p = document.getElementById('adminPass').value;
  const btn = document.getElementById('adminLoginBtn');
  btn.disabled = true; btn.textContent = 'Giriş yapılıyor...';
  const { data, error } = await sb.rpc('platform_admin_login', { p_username: u, p_password: p });
  btn.disabled = false; btn.textContent = 'Giriş Yap';
  if(error || !data || data.length===0){ errBox.textContent = 'Kullanıcı adı veya şifre hatalı'; return; }
  setAdminSession({ session_token: data[0].session_token, username: data[0].username });
  render();
}
function doAdminLogout(){ clearAdminSession(); render(); }

async function renderPromoAdmin(main, admin){
  main.innerHTML = `<h1>Promosyon Kodları</h1><div id="promoContent"></div>`;
  await withLoadingOverlay(refreshPromoList(admin));
}
/* Paketler artık sabit kodlanmış 3 tane değil - platform admin burada
   yeni paket ekleyebilir, mevcutları düzenleyebilir/pasif yapabilir ve
   hiçbir işletme kullanmıyorsa silebilir (bkz. admin_list_packages,
   admin_upsert_package, admin_delete_package). Web sitesi ve kayıt
   ekranı bunları list_packages() ile canlı okur. */
async function renderPricingAdmin(main, admin){
  main.innerHTML = `<h1>💳 Paket Fiyatları</h1><div id="pricingContent"></div>`;
  await withLoadingOverlay(refreshPackagesAdmin(admin));
}
async function refreshPackagesAdmin(admin){
  const el = document.getElementById('pricingContent'); if(!el) return;
  const [{ data, error }, { data: featData }] = await Promise.all([
    sb.rpc('admin_list_packages', { p_token: admin.session_token }),
    sb.rpc('admin_list_feature_catalog', { p_token: admin.session_token })
  ]);
  if(error){
    if(error.message.includes('geçersiz')){ clearAdminSession(); render(); return; }
    el.innerHTML = '<p class="muted">Yüklenemedi: '+error.message+'</p>'; return;
  }
  APP.featureCatalog = featData || [];
  const packages = data || [];
  el.innerHTML = `
    <p class="muted" style="text-align:left;max-width:640px;">Bu fiyatlar, işletmelerin 7 günlük ücretsiz denemesi bittikten sonra
      ödeyeceği AYLIK tutarlardır - web sitesi ve kayıt ekranında canlı olarak gösterilir.</p>
    ${packages.length===0 ? '<p class="muted">Henüz paket yok.</p>' : `
    <div class="settings-table-wrap">
      <table class="settings-table">
        <thead><tr>
          <th>Kimlik</th><th>Ad</th><th>Açıklama</th><th>Kullanıcı Limiti</th><th>Şube Limiti</th><th>Fiyat (TL/ay)</th>
          <th>Popüler</th><th>Aktif</th><th>İşletme</th><th></th>
        </tr></thead>
        <tbody>
        ${packages.map(p => `
          <tr>
            <td class="col-name"><code>${escapeHtml(p.id)}</code></td>
            <td class="col-name"><input value="${escapeHtml(p.name)}" id="pkg_name_${p.id}"></td>
            <td class="col-name"><input value="${escapeHtml(p.description)}" id="pkg_desc_${p.id}"></td>
            <td class="col-num" style="width:90px;"><input type="number" min="1" step="1" value="${p.max_users}" id="pkg_users_${p.id}"></td>
            <td class="col-num" style="width:90px;"><input type="number" min="1" step="1" value="${p.max_branches||1}" id="pkg_branches_${p.id}" title="Bu paketi seçen bir şirket en fazla kaç şube açabilir"></td>
            <td class="col-num" style="width:110px;"><input type="number" min="0" step="0.01" value="${p.price}" id="pkg_price_${p.id}"></td>
            <td style="text-align:center;"><input type="checkbox" id="pkg_popular_${p.id}" ${p.is_popular?'checked':''} style="width:18px;height:18px;"></td>
            <td style="text-align:center;"><input type="checkbox" id="pkg_active_${p.id}" ${p.active?'checked':''} style="width:18px;height:18px;"></td>
            <td class="col-name">${p.restaurant_count} işletme</td>
            <td style="white-space:nowrap;">
              <button class="sbtn" onclick="savePackageRow('${p.id}')">Kaydet</button>
              <button class="sbtn" style="background:var(--red);color:var(--btn-ink);" onclick="deletePackageRow('${p.id}', ${p.restaurant_count})" title="${p.restaurant_count>0?'Bu paketi kullanan işletmeler var':''}">Sil</button>
            </td>
          </tr>
          <tr>
            <td colspan="10" style="padding:6px 8px 16px;border-top:none;">
              <div style="display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;" onclick="togglePackageFeaturePanel('${p.id}')">
                <span id="pkgFeatToggle_${p.id}" class="muted" style="font-size:11px;">▸</span>
                <span class="muted" style="font-size:12px;font-weight:700;">Bu pakette hangi özellikler olacak <span style="font-weight:400;">(${(p.features||[]).length}/${(APP.featureCatalog||[]).length} seçili)</span></span>
              </div>
              <div id="pkgFeatPanel_${p.id}" style="display:none;margin-top:10px;">
                ${featureCheckboxesHtml('pkg_feat_'+p.id, p.features||[])}
              </div>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`}
    <div class="add-row-panel" style="margin-top:20px;">
      <p>Yeni Paket Oluştur</p>
      <div style="display:grid;grid-template-columns:1fr 1fr 1.4fr 0.8fr 0.8fr 0.8fr;gap:10px;align-items:end;">
        <div class="field-group"><label>Kimlik (benzersiz, örn. paket4)</label><input id="npkgId" placeholder="paket4" autocapitalize="none"></div>
        <div class="field-group"><label>Ad</label><input id="npkgName" placeholder="örn. Kurumsal"></div>
        <div class="field-group"><label>Açıklama</label><input id="npkgDesc" placeholder="örn. Çok şubeli zincirler için"></div>
        <div class="field-group"><label>Kullanıcı Limiti</label><input type="number" min="1" step="1" id="npkgUsers" placeholder="20"></div>
        <div class="field-group"><label>Şube Limiti</label><input type="number" min="1" step="1" id="npkgBranches" placeholder="1" value="1"></div>
        <div class="field-group"><label>Fiyat (TL/ay)</label><input type="number" min="0" step="0.01" id="npkgPrice" placeholder="1499"></div>
      </div>
      <div class="muted" style="font-size:12px;font-weight:700;margin:14px 0 6px;">Bu pakette hangi özellikler olacak:</div>
      ${featureCheckboxesHtml('npkg_feat', (APP.featureCatalog||[]).filter(f=>f.is_core).map(f=>f.id))}
      <button style="margin-top:12px;max-width:220px;" onclick="createPackage()">+ Paket Oluştur</button>
      <div class="error" id="pkgCreateErr" style="text-align:left;"></div>
    </div>`;
}
/* Paket düzenleme/oluşturma satırlarında ortak kullanılan özellik seçim
   ızgarası - feature_catalog'daki HER özelliği kategoriye göre gruplayıp
   gösterir (kataloğu "🗂️ Tüm Özellikler" sekmesinden yönetirsiniz);
   id'ler idPrefix+'_'+anahtar şeklinde, readPackageFeatures ile okunur. */
function featureCheckboxesHtml(idPrefix, selectedFeatures){
  const sel = new Set(selectedFeatures||[]);
  const features = APP.featureCatalog || [];
  if(features.length===0) return '<p class="muted">Önce "🗂️ Tüm Özellikler" sekmesinden özellik tanımlayın.</p>';
  const byCat = {};
  features.forEach(f => { (byCat[f.category||'Diğer'] = byCat[f.category||'Diğer'] || []).push(f); });
  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;align-items:start;">
    ${Object.keys(byCat).map(cat => {
      const catId = idPrefix+'_cat_'+cat.replace(/[^a-zA-Z0-9]/g,'_');
      const catSelCount = byCat[cat].filter(f => sel.has(f.id)).length;
      return `
      <div style="background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
          <div style="font-size:12px;font-weight:800;">${escapeHtml(cat)} <span class="muted" style="font-weight:400;">(${catSelCount}/${byCat[cat].length})</span></div>
          <div style="display:flex;gap:8px;flex-shrink:0;">
            <span style="font-size:11px;color:var(--accent);cursor:pointer;" onclick="toggleFeatureCategory('${catId}', true)">tümü</span>
            <span style="font-size:11px;color:var(--accent);cursor:pointer;" onclick="toggleFeatureCategory('${catId}', false)">temizle</span>
          </div>
        </div>
        <div id="${catId}" style="display:flex;flex-direction:column;gap:6px;">
          ${byCat[cat].map(f => `
            <label style="display:flex;align-items:flex-start;gap:6px;font-size:12.5px;font-weight:400;line-height:1.3;">
              <input type="checkbox" id="${idPrefix}_${f.id}" ${sel.has(f.id)?'checked':''} style="width:15px;height:15px;flex-shrink:0;margin-top:1px;">
              <span>${escapeHtml(f.label)}${f.is_addon?' <span class="muted">(eklenti'+(f.price>0?', '+money(f.price)+'/ay':'')+')</span>':''}</span>
            </label>`).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}
function toggleFeatureCategory(catId, checked){
  document.querySelectorAll('#'+catId+' input[type=checkbox]').forEach(el => { el.checked = checked; });
}
function togglePackageFeaturePanel(id){
  const panel = document.getElementById('pkgFeatPanel_'+id);
  const arrow = document.getElementById('pkgFeatToggle_'+id);
  const open = panel.style.display !== 'none';
  panel.style.display = open ? 'none' : 'block';
  arrow.textContent = open ? '▸' : '▾';
}
function readPackageFeatures(idPrefix){
  return (APP.featureCatalog||[]).map(f => f.id).filter(key => {
    const el = document.getElementById(idPrefix+'_'+key);
    return el && el.checked;
  });
}
async function savePackageRow(id){
  const admin = getAdminSession();
  const name = document.getElementById('pkg_name_'+id).value.trim();
  const desc = document.getElementById('pkg_desc_'+id).value.trim();
  const maxUsers = Number(document.getElementById('pkg_users_'+id).value);
  const maxBranches = Number(document.getElementById('pkg_branches_'+id).value);
  const price = Number(document.getElementById('pkg_price_'+id).value);
  const popular = document.getElementById('pkg_popular_'+id).checked;
  const active = document.getElementById('pkg_active_'+id).checked;
  if(!name){ alert('Paket adı gerekli'); return; }
  if(!(maxUsers>=1)){ alert('Kullanıcı limiti en az 1 olmalı'); return; }
  if(!(maxBranches>=1)){ alert('Şube limiti en az 1 olmalı'); return; }
  if(!(price>=0)){ alert('Fiyat negatif olamaz'); return; }
  const features = readPackageFeatures('pkg_feat_'+id);
  const { error } = await sb.rpc('admin_upsert_package', {
    p_token: admin.session_token, p_id: id, p_name: name, p_description: desc,
    p_max_users: maxUsers, p_price: price, p_is_popular: popular, p_active: active, p_features: features,
    p_max_branches: maxBranches
  });
  if(error){ alert(error.message); return; }
  showToast('Paket kaydedildi ✓');
  refreshPackagesAdmin(admin);
}
async function deletePackageRow(id, restaurantCount){
  if(restaurantCount>0){ alert('Bu paketi kullanan '+restaurantCount+' işletme var, silmeden önce onları başka bir pakete taşıyın.'); return; }
  if(!confirm('"'+id+'" paketini silmek istediğinize emin misiniz?')) return;
  const admin = getAdminSession();
  const { error } = await sb.rpc('admin_delete_package', { p_token: admin.session_token, p_id: id });
  if(error){ alert(error.message); return; }

/* ---- İşletmeler (tenant analiz/raporu): tüm işletmelerin kayıt tarihi,
   aktiflik durumu, paketi, son aktifliği ve ciro özetini tek ekranda
   gösterir; platform admin buradan işletmeleri aktif/pasif edebilir
   (bkz. admin_list_restaurants, admin_platform_summary,
   admin_set_restaurant_active, admin_restaurant_daily_stats). ---- */
function statCard(label, value, color){
  return `<div class="card" style="cursor:default;">
    <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;">${escapeHtml(label)}</div>
    <div style="font-size:22px;font-weight:800;margin-top:6px;${color?'color:'+color+';':''}">${value}</div>
  </div>`;
}
/* admin_*_stats fonksiyonları hiç aktivite yoksa 'epoch' (1970) döndürür -
   bu "hiç kullanılmadı" anlamına gelir, göreli zaman yerine "Hiç" yazılır. */
function fmtRelativeTime(iso){
  if(!iso) return 'Hiç';
  const d = new Date(iso);
  if(isNaN(d.getTime()) || d.getFullYear() < 2000) return 'Hiç';
  const diffMin = Math.floor((Date.now() - d.getTime())/60000);
  if(diffMin < 1) return 'Az önce';
  if(diffMin < 60) return diffMin+' dk önce';
  const diffH = Math.floor(diffMin/60);
  if(diffH < 24) return diffH+' sa önce';
  const diffD = Math.floor(diffH/24);
  if(diffD < 30) return diffD+' gün önce';
  return d.toLocaleDateString('tr-TR');
}
function renderDailyRevenueChart(days){
  const w = 760, h = 160, padBottom = 22, padTop = 10;
  const maxVal = Math.max(1, ...days.map(d => Number(d.revenue)||0));
  const gap = 3;
  const barW = (w/days.length) - gap;
  const bars = days.map((d,i) => {
    const val = Number(d.revenue)||0;
    const bh = maxVal>0 ? (val/maxVal) * (h-padTop-padBottom) : 0;
    const x = i*(barW+gap);
    const y = h - padBottom - bh;
    const dateLabel = new Date(d.day+'T00:00:00').toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'});
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" rx="3" fill="var(--accent)"><title>${dateLabel}: ${money(val)} (${d.order_count} sipariş)</title></rect>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="140" preserveAspectRatio="none" style="overflow:visible;display:block;">
    <line x1="0" y1="${h-padBottom}" x2="${w}" y2="${h-padBottom}" stroke="var(--border)" stroke-width="1"/>
    ${bars}
  </svg>
  <div class="muted" style="display:flex;justify-content:space-between;font-size:11px;margin-top:4px;">
    <span>${new Date(days[0].day+'T00:00:00').toLocaleDateString('tr-TR')}</span>
    <span>${new Date(days[days.length-1].day+'T00:00:00').toLocaleDateString('tr-TR')}</span>
  </div>`;
}

  document.querySelectorAll('[id^="detail_"]').forEach(r => { if(r!==row) r.style.display = 'none'; });
  if(wasOpen){ row.style.display = 'none'; return; }
  row.style.display = 'table-row';
  const body = document.getElementById('detailBody_'+id);
  body.innerHTML = '<p class="muted" style="padding:14px;">Yükleniyor...</p>';
  const admin = getAdminSession();
  const { data, error } = await sb.rpc('admin_restaurant_daily_stats', { p_token: admin.session_token, p_restaurant_id: id });
  if(error){ body.innerHTML = '<p class="muted" style="padding:14px;">Yüklenemedi: '+error.message+'</p>'; return; }
  const days = data || [];
  if(days.length===0){ body.innerHTML = '<p class="muted" style="padding:14px;">Veri yok.</p>'; return; }
  const totalRevenue = days.reduce((sum,d) => sum + Number(d.revenue||0), 0);

  const restaurant = (APP.adminRestaurants||[]).find(r => r.id===id);
  body.innerHTML = `

      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
        <h3 style="margin:0;font-size:15px;">Son 30 Gün${restaurant?' - '+escapeHtml(restaurant.name):''}</h3>

function renderFeaturePickerList(){
  const listEl = document.getElementById('featPickerList'); if(!listEl) return;
  const q = (document.getElementById('featPickerSearch').value||'').trim().toLowerCase();
  const existingIds = new Set((APP.featureCatalog||[]).map(f => f.id));
  const items = FEATURE_MASTER_LIST.filter(f => !q || f.label.toLowerCase().includes(q) || f.category.toLowerCase().includes(q) || f.id.toLowerCase().includes(q));
  listEl.innerHTML = items.length===0 ? '<p class="muted" style="margin:6px 0;">Eşleşen özellik yok.</p>' : items.map(f => {
    const already = existingIds.has(f.id);
    return `<label style="display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:6px;${already?'opacity:.55;':''}cursor:${already?'default':'pointer'};">
      <input type="checkbox" data-feat-pick="${f.id}" ${already?'checked disabled':''} style="width:16px;height:16px;flex-shrink:0;">
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:600;">${escapeHtml(f.label)} <span class="muted" style="font-weight:400;">· ${escapeHtml(f.category)}</span>${already?' <span class="muted" style="font-weight:400;">(zaten ekli)</span>':''}</div>
        ${f.description ? `<div class="muted" style="font-size:11.5px;">${escapeHtml(f.description)}</div>` : ''}
      </div>
    </label>`;
  }).join('');
}
async function addPickedFeatures(){
  const admin = getAdminSession();
  const picked = Array.from(document.querySelectorAll('#featPickerList input[data-feat-pick]:checked:not(:disabled)')).map(el => el.dataset.featPick);
  if(picked.length===0){ showToast('Önce en az bir özellik işaretleyin'); return; }
  const items = FEATURE_MASTER_LIST.filter(f => picked.includes(f.id));
  const results = await withLoadingOverlay(Promise.all(items.map(f =>
    sb.rpc('admin_upsert_feature', { p_token: admin.session_token, p_id: f.id, p_label: f.label, p_category: f.category, p_is_addon: false, p_price: 0, p_description: f.description||null, p_active: true })
  )));
  const failed = results.find(r => r.error);
  if(failed){ alert(failed.error.message); }
  showToast(items.length+' özellik eklendi ✓');
  refreshFeatureCatalogList(admin);
}
async function saveFeatureRow(id){
  const admin = getAdminSession();
  const label = document.getElementById('feat_label_'+id).value.trim();
  const desc = document.getElementById('feat_desc_'+id).value.trim();
  const cat = document.getElementById('feat_cat_'+id).value.trim() || 'Diğer';
  const price = parseFloat(document.getElementById('feat_price_'+id).value) || 0;
  const active = document.getElementById('feat_active_'+id).checked;
  const isAddon = document.getElementById('feat_isaddon_'+id).checked;
  if(!label){ alert('Ad gerekli'); return; }
  const { error } = await sb.rpc('admin_upsert_feature', { p_token: admin.session_token, p_id: id, p_label: label, p_category: cat, p_is_addon: isAddon, p_price: price, p_description: desc||null, p_active: active });
  if(error){ alert(error.message); return; }
  showToast('Özellik kaydedildi ✓');
  refreshFeatureCatalogList(admin);
}
async function createFeatureSubmit(){
  const admin = getAdminSession();
  const id = document.getElementById('newFeatId').value.trim().toLowerCase();
  const label = document.getElementById('newFeatLabel').value.trim();
  const desc = document.getElementById('newFeatDesc').value.trim();
  const cat = document.getElementById('newFeatCat').value.trim() || 'Diğer';
  const price = parseFloat(document.getElementById('newFeatPrice').value) || 0;
  const isAddon = document.getElementById('newFeatIsAddon').checked;
  const errEl = document.getElementById('newFeatErr');
  errEl.textContent = '';
  if(!id || !/^[a-z0-9_-]+$/.test(id)){ errEl.textContent = 'Kimlik sadece küçük harf/rakam/tire içerebilir'; return; }
  if(!label){ errEl.textContent = 'Ad gerekli'; return; }
  const { error } = await sb.rpc('admin_upsert_feature', { p_token: admin.session_token, p_id: id, p_label: label, p_category: cat, p_is_addon: isAddon, p_price: price, p_description: desc||null, p_active: true });
  if(error){ errEl.textContent = error.message; return; }
  showToast('Özellik oluşturuldu ✓');
  refreshFeatureCatalogList(admin);
}
async function deleteFeatureRow(id){
  if(!confirm('Bu özelliği silmek istediğinize emin misiniz? Bu özelliğe sahip paketler ve eklenti atamaları etkilenir.')) return;
  const admin = getAdminSession();
  const { error } = await sb.rpc('admin_delete_feature', { p_token: admin.session_token, p_id: id });
  if(error){ alert(error.message); return; }
  showToast('Özellik silindi ✓');
  refreshFeatureCatalogList(admin);
}
/* İşletmeler/Şirketler listesindeki "🧩 Eklentiler" butonu - bir hedefin
   (restaurant/company) hangi eklentilere sahip olduğunu gösterip
   açma/kapama sağlayan küçük bir pencere. */
async function openEntitlementsModal(targetType, targetId, targetName){
  const admin = getAdminSession();
  const [{ data: features, error: e1 }, { data: owned, error: e2 }] = await withLoadingOverlay(Promise.all([
    APP.featureCatalog ? Promise.resolve({ data: APP.featureCatalog, error: null }) : sb.rpc('admin_list_feature_catalog', { p_token: admin.session_token }),
    sb.rpc('admin_list_target_entitlements', { p_token: admin.session_token, p_target_type: targetType, p_target_id: targetId })
  ]));
  if(e1 || e2){ alert((e1||e2).message); return; }
  const addons = (features||[]).filter(f => f.is_addon);
  const ownedSet = new Set(owned || []);
  const bg = document.createElement('div');
  bg.id = 'entitlementsBg';
  bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;';
  bg.onclick = (e) => { if(e.target===bg) bg.remove(); };
  bg.innerHTML = `<div style="background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;max-width:420px;width:100%;max-height:85vh;overflow:auto;">
    <div style="display:flex;justify-content:space-between;align-items:center;"><h2 style="margin:0;">🧩 Eklentiler</h2><span style="cursor:pointer;color:var(--muted);font-size:20px;" onclick="document.getElementById('entitlementsBg').remove()">✕</span></div>
    <p class="muted" style="margin-top:6px;">${escapeHtml(targetName)}</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">
      ${addons.length===0 ? '<p class="muted">Henüz hiç eklenti tanımlanmamış.</p>' : addons.map(a => `
        <label style="display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;">
          <input type="checkbox" style="width:auto;margin:0;" ${ownedSet.has(a.id)?'checked':''} onchange="setEntitlement('${targetType}','${targetId}','${a.id}',this.checked,this)">
          <div style="flex:1;">
            <div style="font-weight:700;">${escapeHtml(a.label)}</div>
            <div class="muted" style="font-size:12px;">${escapeHtml(a.description||'')} ${a.price>0?'· '+money(a.price)+'/ay':''}</div>
          </div>
        </label>`).join('')}
    </div>
  </div>`;
  document.body.appendChild(bg);
}
async function setEntitlement(targetType, targetId, addonId, enabled, checkboxEl){
  const admin = getAdminSession();
  checkboxEl.disabled = true;
  const { error } = await sb.rpc('admin_set_entitlement', { p_token: admin.session_token, p_target_type: targetType, p_target_id: targetId, p_addon_id: addonId, p_enabled: enabled });
  checkboxEl.disabled = false;
  if(error){ alert(error.message); checkboxEl.checked = !enabled; return; }
  showToast(enabled ? 'Eklenti açıldı ✓' : 'Eklenti kapatıldı ✓');
}

/* IBAN'ı yazarken otomatik "TR00 0000 0000 0000 0000 0000 00" biçimine
   sokar - harfler büyütülür, rakam/harf olmayanlar atılır, 4'lü gruplara
   boşluk konur. İmleç her tuşta sona atlıyor (basit alan için kabul
   edilebilir bir ödün). */
function formatIbanInput(el){
  const raw = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 26);
  el.value = raw.replace(/(.{4})/g, '$1 ').trim();
}
async function saveBankTransferInfo(){
  const admin = getAdminSession();
  const iban = document.getElementById('bankIban').value.trim();
  const accountName = document.getElementById('bankAccountName').value.trim();
  const bankName = document.getElementById('bankName').value.trim();
  const whatsapp = document.getElementById('bankWhatsapp').value.trim();
  const notifyEmail = document.getElementById('bankNotifyEmail').value.trim();
  const errEl = document.getElementById('bankInfoErr');
  errEl.textContent = '';
  const { error } = await sb.rpc('admin_update_bank_transfer_info', {
    p_token: admin.session_token, p_iban: iban, p_account_name: accountName, p_bank_name: bankName, p_whatsapp_number: whatsapp, p_notify_email: notifyEmail
  });

async function createPromo(){
  const admin = getAdminSession();
  const code = document.getElementById('npCode').value.trim();
  const type = document.getElementById('npType').value;
  const value = parseFloat(document.getElementById('npValue').value);
  const maxRaw = document.getElementById('npMax').value.trim();
  const max = maxRaw==='' ? null : parseInt(maxRaw,10);
  const expiresRaw = document.getElementById('npExpires').value;
  const expires = expiresRaw ? new Date(expiresRaw+'T23:59:59').toISOString() : null;
  if(!code || !value){ alert('Kod ve değer gerekli'); return; }
  const { error } = await sb.rpc('create_promo_code', { p_token: admin.session_token, p_code: code, p_discount_type: type, p_discount_value: value, p_max_uses: max, p_expires_at: expires });
  if(error){ alert(error.message); return; }
  refreshPromoList(admin);
}
async function togglePromo(id){
  const admin = getAdminSession();
  const { error } = await sb.rpc('toggle_promo_code', { p_token: admin.session_token, p_id: id });
  if(error){ alert(error.message); return; }
  refreshPromoList(admin);
}

}

async function changeAdminPassword(){
  const admin = getAdminSession();
  const errBox = document.getElementById('adminPassErr');
  errBox.textContent = '';
  const newPass = document.getElementById('newAdminPass').value;
  const newPass2 = document.getElementById('newAdminPass2').value;

  showToast('Şifreniz güncellendi ✓');

async function doCompanyLogin(){
  const code = document.getElementById('companyCodeInput').value.trim();
  const password = document.getElementById('companyPassInput').value;
  const errBox = document.getElementById('companyErrBox');
  const btn = document.getElementById('companyLoginBtn');
  errBox.textContent = '';
  if(!code || !password){ errBox.textContent = 'Tüm alanları doldurun'; return; }
  btn.disabled = true; btn.textContent = 'Giriş yapılıyor...';
  try{
    const { data, error } = await sb.rpc('login_company', { p_code: code, p_password: password });
    if(error){ errBox.textContent = 'Bağlantı hatası: ' + error.message; return; }
    if(!data || data.length === 0){ errBox.textContent = 'Şirket kodu veya şifre hatalı'; return; }
    const row = data[0];
    setCompanySession({ session_token: row.session_token, company_id: row.company_id, company_name: row.company_name, package_id: row.package_id });
    APP.authScreen = 'login';
    render();
  }catch(err){
    console.error(err);
    errBox.textContent = 'Beklenmeyen bir hata oluştu';
  }finally{
    btn.disabled = false; btn.textContent = 'Giriş Yap';
  }
}

function setCompanyDashboardRangeDays(daysBack){

async function startRenewalPayment(){
  const code = document.getElementById('exCode').value.trim();
  const username = document.getElementById('exUser').value.trim();
  const password = document.getElementById('exPass').value;
  const errBox = document.getElementById('exErr');
  const btn = document.getElementById('exPayBtn');
  errBox.textContent = '';
  if(!code || !username || !password){ errBox.textContent = 'Tüm alanları doldurun'; return; }
  btn.disabled = true; btn.textContent = 'Yönlendiriliyor...';
  try{
    const res = await fetch(PAYMENT_RENEW_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ p_code: code, p_username: username, p_password: password })
    });
    const result = await res.json();
    if(!res.ok || !result.paymentPageUrl){
      errBox.textContent = result.errorMessage || 'Ödeme başlatılamadı';
      btn.disabled = false; btn.textContent = '💳 Ödemeye Geç';
      return;
    }
    window.location.href = result.paymentPageUrl;
  }catch(e){
    errBox.textContent = 'Beklenmeyen bir hata oluştu';
    btn.disabled = false; btn.textContent = '💳 Ödemeye Geç';
  }
}

async function doStartPasswordReset(){
  const errBox = document.getElementById('fpErr');

  APP.pendingReset = { code, username };
  APP.forgotStep = 2;

async function doVerifyPasswordReset(){
  const errBox = document.getElementById('fpErr');

  const otp = document.getElementById('fpOtp').value.trim();

  if(!otp){ errBox.textContent = 'Kodu girin'; return; }
  if(!newPass || newPass.length<4){ errBox.textContent = 'En az 4 karakter bir şifre girin'; return; }
  if(newPass !== newPass2){ errBox.textContent = 'Girdiğiniz şifreler eşleşmiyor'; return; }
  const btn = document.getElementById('fpVerifyBtn');
  btn.disabled = true; btn.textContent = 'Güncelleniyor...';
  const { error } = await sb.rpc('verify_password_reset', {
    p_code: pending.code, p_username: pending.username, p_otp: otp, p_new_password: newPass
  });
  btn.disabled = false; btn.textContent = 'Şifreyi Güncelle';

async function loadPackagesThenRenderCards(){

async function doStartSignup(){
  const errBox = document.getElementById('suErr');
  errBox.textContent = '';
  const name = document.getElementById('suName').value.trim();
  const code = document.getElementById('suCode').value.trim().toLowerCase();
  const email = document.getElementById('suEmail').value.trim();
  const phone = document.getElementById('suPhone').value.trim().replace(/\s+/g,'');
  const adminUser = document.getElementById('suAdminUser').value.trim();
  const adminPass = document.getElementById('suAdminPass').value;
  const promo = document.getElementById('suPromo').value.trim();
  if(!name || !code || !email || !phone || !adminUser || !adminPass){ errBox.textContent = 'Tüm alanları doldurun'; return; }
  if(!email.includes('@')){ errBox.textContent = 'Geçerli bir e-posta girin'; return; }
  if(phone.length<10){ errBox.textContent = 'Geçerli bir telefon numarası girin'; return; }
  if(!APP.selectedPackage){ errBox.textContent = 'Bir paket seçin'; return; }
  if(!document.getElementById('suPrivacyConsent').checked){ errBox.textContent = 'Devam etmek için Gizlilik Politikası\'nı kabul etmeniz gerekiyor'; return; }
  const btn = document.getElementById('signupBtn');
  btn.disabled = true; btn.textContent = 'Gönderiliyor...';
  const { data, error } = await sb.rpc('start_registration', { p_email: email, p_phone: phone });
  btn.disabled = false; btn.textContent = 'Doğrulama Kodu Gönder';
  if(error){ errBox.textContent = error.message; return; }
  APP.pendingSignup = { name, code, email, phone, adminUser, adminPass, promo };
  document.getElementById('signupStep1').style.display='none';
  document.getElementById('signupStep2').style.display='block';
  document.getElementById('signupTitle').textContent='E-postanızı Doğrulayın';
  document.getElementById('signupSub').textContent = email+' adresine gönderilen 6 haneli kodu girin.';
  const otpInfo = document.getElementById('otpInfo');
  if(data && data.sent===false){
    otpInfo.innerHTML = '⚠️ TEST MODU: E-posta sağlayıcısı henüz ayarlanmamış. Kodunuz: <b>'+data.test_otp+'</b>';
  } else {
    otpInfo.textContent = 'Kod birkaç saniye içinde e-postanıza ulaşacaktır (gelen kutusunu ve spam klasörünü kontrol edin).';
  }
}
async function doVerifySignup(){
  const errBox = document.getElementById('suErr');
  errBox.textContent = '';
  const otp = document.getElementById('suOtp').value.trim();
  if(!otp){ errBox.textContent = 'Kodu girin'; return; }
  const p = APP.pendingSignup;
  if(!p){ errBox.textContent = 'Bir hata oluştu, baştan deneyin'; backToSignupForm(); return; }
  const btn = document.getElementById('verifyBtn');
  btn.disabled = true; btn.textContent = 'Doğrulanıyor...';
  const { data, error } = await sb.rpc('verify_registration_otp', {
    p_phone: p.phone, p_otp: otp,
    p_name: p.name, p_code: p.code, p_package_id: APP.selectedPackage, p_email: p.email,
    p_admin_username: p.adminUser, p_admin_password: p.adminPass
  });
  btn.disabled = false; btn.textContent = 'Doğrula ve Kaydı Tamamla';
  if(error){ errBox.textContent = error.message; return; }
  const code = p.code;
  APP.pendingSignup = null;
  // Hesap artik odeme beklemeden 7 gunluk ucretsiz deneme ile direkt aktif aciliyor.
  APP.authScreen = 'login';
  render();
  alert('Kaydınız oluşturuldu! 7 günlük ücretsiz deneme süreniz başladı.\n\nİşletme kodu: ' + code + '\nŞimdi giriş yapabilirsiniz.');
}

async function refreshKitchenItems(session){
  const { data, error } = await sb.rpc('get_live_orders', { p_token: session.session_token });
  const wrap = document.getElementById('kitchenWrap'); if(!wrap) return;
  if(error){ wrap.innerHTML = '<p class="muted">Yüklenemedi: '+error.message+'</p>'; return; }
  APP.liveOrders = data || [];
  const cards = [];
  APP.kitchenPendingByTable = {};
  const currentIds = new Set();
  // Yazicinin fiziksel olarak bu istasyonun kendi bilgisayarina bagli olabilmesi
  // (mutfak icin ayri bilgisayar, cayhane icin ayri bilgisayar gibi) nedeniyle fis
  // yazdirma artik siparis onaylanirken degil, burada - o istasyonun kendi ekraninda
  // yeni bir urun ilk kez gorundugunde - tetikleniyor (WebUSB sadece ayni cihaza
  // fiziksel olarak bagli yaziciya erisebilir).
  const isFirstLoad = !APP.kitchenSeenItemIds;
  const newItemsByTable = {};
  APP.liveOrders.forEach(o => {
    // Sadece bu istasyona ait ve henuz hazirlanmamis urunler - her siparisin bu
    // istasyona dusen urunleri tek bir kartta gruplanmis olarak gorunur. Kartlar
    // order_id ile anahtarlanir (table_id Paket Servis siparislerinde null/ortak
    // oldugu icin table_id kullanmak birden fazla paket siparisini karistirirdi).
    // station_id atanmamis (null) urunler hicbir ekranda kaybolmasin diye her istasyonda gosterilir.
    const pending = o.items.filter(i => i.status==='pending' && (i.station_id===APP.kitchenStation || i.station_id==null));
    if(pending.length===0) return;
    pending.forEach(it => currentIds.add(it.id));
    const tableName = orderDisplayName(o);
    APP.kitchenPendingByTable[o.order_id] = { tableName, items: pending, dailyNumber: o.daily_number };
    if(!isFirstLoad){
      const freshItems = pending.filter(it => !APP.kitchenSeenItemIds.has(it.id));
      if(freshItems.length>0) newItemsByTable[o.order_id] = { tableName, dailyNumber: o.daily_number, items: freshItems };
    }
    cards.push(`<div class="kitchen-card" data-order-id="${o.order_id}">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b>${escapeHtml(tableName)}${o.daily_number?' <span class="muted" style="font-weight:400;font-size:12px;">#'+o.daily_number+'</span>':''}<span class="kc-late-badge">⏰ GECİKTİ</span></b>
        <span style="cursor:pointer;color:var(--muted);font-size:16px;" onclick="reprintKitchenTicket('${o.order_id}')" title="Fişi tekrar yazdır">🖨️</span>
      </div>
      ${pending.map(it => `<div class="kitchen-item-row" style="padding:10px 0;border-top:1px dashed var(--border);">
        <div style="display:grid;grid-template-columns:1fr 64px auto;align-items:center;gap:10px;">
          <span class="kitchen-item-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${it.qty}x ${escapeHtml(it.name)}</span>
          <span class="kitchen-timer" data-added="${it.added_at||''}" data-id="${it.id}" data-name="${escapeHtml(tableName+' - '+it.qty+'x '+it.name)}" style="text-align:center;">-</span>
          <button style="width:auto;padding:8px 14px;font-size:14px;background:var(--green);color:var(--btn-ink);" onclick="markReady('${it.id}')">Hazır</button>
        </div>
        ${it.note?'<div class="muted" style="font-size:12px;font-style:italic;margin-top:4px;overflow-wrap:anywhere;word-break:break-word;">Not: '+escapeHtml(it.note)+'</div>':''}
      </div>`).join('')}
      <button style="margin-top:10px;background:var(--green);color:var(--btn-ink);" onclick="markAllReady('${o.order_id}')">✅ Hepsi Hazır</button>
      </div>`);
  });
  wrap.innerHTML = cards.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;">${cards.join('')}</div>` : '<p class="muted">Bekleyen sipariş yok.</p>';

  // Daha once gorulmemis (yeni gelen) urun varsa zil calsin ve fisini bu istasyonun
  // kendi yazicisina yazdir. Ilk yuklemede (isFirstLoad) hicbiri tetiklenmez.
  const hasNew = Object.keys(newItemsByTable).length>0;
  if(hasNew){
    playKitchenBell(APP.kitchenStation);
    Object.values(newItemsByTable).forEach(entry => {
      printKitchenTicketGrouped(entry.tableName, entry.items, true, entry.dailyNumber)
        .catch(e => { console.error('Fiş yazdırma hatası:', e); showToast('⚠️ Fiş yazdırılırken beklenmeyen bir hata oluştu'); });
    });
  }
  APP.kitchenSeenItemIds = currentIds;
  updateKitchenTimers();
}

/* ---- Mutfak: canli sayac + yeni siparis zili ---- */
function stopKitchenPolling(){
  if(APP.kitchenPollInterval){ clearInterval(APP.kitchenPollInterval); APP.kitchenPollInterval=null; }
  if(APP.kitchenTimerInterval){ clearInterval(APP.kitchenTimerInterval); APP.kitchenTimerInterval=null; }
  if(APP.kitchenReminderInterval){ clearInterval(APP.kitchenReminderInterval); APP.kitchenReminderInterval=null; }
}
function startKitchenPolling(session){
  stopKitchenPolling();
  // Yeni siparisleri yakalamak icin arka planda periyodik yenileme (websocket/canli
  // abonelik kurulmadigi icin en basit ve guvenilir yontem bu).
  APP.kitchenPollInterval = setInterval(() => {
    if(APP.view==='kitchen' && APP.kitchenStation) refreshKitchenItems(session);
  }, 2000);
  APP.kitchenTimerInterval = setInterval(updateKitchenTimers, 1000);
  // 15 dakikayi gecmis, hala hazir verilmemis siparisler icin sol tarafta
  // (sag ustteki tek seferlik uyaridan ayri) her 3 dakikada bir tekrarlanan
  // hatirlatma - mutfak ekranindan uzaklasilsa/personel gozden kacirsa bile
  // gec kalmis siparisler unutulmasin diye.
  APP.kitchenReminderInterval = setInterval(checkLateOrdersReminder, 180000);
}
function updateKitchenTimers(){
  if(!APP.kitchenLateWarned) APP.kitchenLateWarned = new Set();
  document.querySelectorAll('.kitchen-timer[data-added]').forEach(el => {
    const added = el.dataset.added;
    if(!added){ el.textContent='-'; return; }
    const secs = Math.max(0, Math.floor((Date.now() - new Date(added).getTime())/1000));
    const mm = Math.floor(secs/60), ss = secs%60;
    el.textContent = mm + ':' + String(ss).padStart(2,'0');
    // 0-10 dk yesil (varsayilan), 10-15 dk sari, 15 dk+ kirmizi.
    el.classList.toggle('kt-warn', secs>=600 && secs<900);
    el.classList.toggle('kt-danger', secs>=900);
    // Urun adi da (sadece sayac degil) ayni renge boyansin diye satirin
    // kendisine de ayni durum sinifi uygulanir.
    const row = el.closest('.kitchen-item-row');
    if(row){
      row.classList.toggle('ki-warn', secs>=600 && secs<900);
      row.classList.toggle('ki-danger', secs>=900);
    }
    // 15 dakikayi gectiginde, urun basina bir kez sag ustte uyari mesaji
    // goster - en az 30 saniye ekranda kalsin diye suresi acikca veriliyor.
    const itemId = el.dataset.id;
    if(secs>=900 && itemId && !APP.kitchenLateWarned.has(itemId)){
      APP.kitchenLateWarned.add(itemId);
      showToast('⏰ ' + (el.dataset.name||'Bir sipariş') + ' 15 dakikayı geçti!', 30000, null, () => goToView('kitchen'), true);
    }
  });
  // Kartin arka plani, icindeki en gec kalmis urunun rengine gore hafifce tonlanir.
  document.querySelectorAll('.kitchen-card').forEach(card => {
    const timers = card.querySelectorAll('.kitchen-timer');
    let worst = 'ok';
    timers.forEach(t => {
      if(t.classList.contains('kt-danger')) worst = 'danger';
      else if(t.classList.contains('kt-warn') && worst!=='danger') worst = 'warn';
    });
    card.classList.toggle('kc-warn', worst==='warn');
    card.classList.toggle('kc-danger', worst==='danger');
  });
}
/* Hala hazir verilmemis (15 dk+ gecikmis) urunleri sol tarafta toplu bir
   bildirimle hatirlatir - startKitchenPolling icinde 3 dakikada bir cagrilir. */
function checkLateOrdersReminder(){
  if(APP.view!=='kitchen' || !APP.kitchenStation) return;
  const names = Array.from(document.querySelectorAll('.kitchen-timer.kt-danger[data-added]'))
    .map(el => el.dataset.name)
    .filter(Boolean);
  if(names.length===0) return;
  const shown = names.slice(0,3).join(', ') + (names.length>3 ? ' ve ' + (names.length-3) + ' tane daha' : '');
  showToast('⏰ Hâlâ hazır değil: ' + shown, 30000, 'left', () => goToView('kitchen'), true);
}
let KITCHEN_AUDIO_CTX = null;
/* Tarayicilar bir kullanici tiklamasi olmadan ses calmayi engeller; istasyon secimi
   gibi gercek bir tiklama aninda AudioContext'i "kilidini acmak" icin onceden calistirilir. */
function primeKitchenAudio(){
  try{
    KITCHEN_AUDIO_CTX = KITCHEN_AUDIO_CTX || new (window.AudioContext || window.webkitAudioContext)();
    if(KITCHEN_AUDIO_CTX.state==='suspended') KITCHEN_AUDIO_CTX.resume();
  }catch(e){}
  try{ const a = new Audio(); a.volume = 0; a.play().catch(()=>{}); }catch(e){}
}
/* Tüm zil ön ayarları 3 katmanlı, ÖLÇÜLÜ bir zincirden geçer.
   ÖNEMLİ: cızırtının asıl kaynağı bu zincir değil, kaynaktaki (osilatör)
   ses seviyesiydi - her nota 3 uyumlu kısmi (partial) üst üste bindiği için
   toplam tepe genliği kazanç*1.62'ye ulaşıyordu; kazanç 1.3-1.4 iken bu,
   dijital tavanın (1.0) iki katını buluyor ve compressor'ın tepki (attack)
   süresi yetişemeden gerçek kırpılmaya yol açıyordu. Şimdi kaynak
   seviyeleri (BELL_PRESETS içindeki kazanımlar) güvenli aralığa çekildi;
   buradaki zincir sadece o temiz sinyali biraz daha yükseltip son bir
   güvenlik limiteriyle korumaya devam ediyor. */
let BELL_CHAIN = null, BELL_CHAIN_CTX = null;
function getBellCompressor(ctx){
  if(BELL_CHAIN && BELL_CHAIN_CTX===ctx) return BELL_CHAIN;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -10; comp.knee.value = 6; comp.ratio.value = 4;
  comp.attack.value = 0.008; comp.release.value = 0.2;
  const makeup = ctx.createGain();
  makeup.gain.value = 1.6;
  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -1; limiter.knee.value = 3; limiter.ratio.value = 12;
  limiter.attack.value = 0.003; limiter.release.value = 0.15;
  comp.connect(makeup); makeup.connect(limiter); limiter.connect(ctx.destination);
  BELL_CHAIN = comp; BELL_CHAIN_CTX = ctx;
  return comp;
}
/* Tek bir "çan" notası: temel ton + iki uyumlu üst kısmi (bell partial)
   katmanlanır. Tek başına kare/testere dalga yerine bu katmanlı sinüs/üçgen
   yapısı hem daha belirgin algılanıyor hem de kulağı yormuyor. */
function scheduleBellTone(ctx, freq, t0, dur, peakGain){
  const partials = [
    {ratio:1,    gain:1.0,  type:'sine'},
    {ratio:2.01, gain:0.4,  type:'sine'},
    {ratio:2.76, gain:0.22, type:'triangle'},
  ];
  partials.forEach(p => {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = p.type;
    osc.frequency.value = freq*p.ratio;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0005, peakGain*p.gain), t0+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(getBellCompressor(ctx));
    osc.start(t0); osc.stop(t0+dur+0.05);
  });
}

function playBellPresetById(id){
  try{
    KITCHEN_AUDIO_CTX = KITCHEN_AUDIO_CTX || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = KITCHEN_AUDIO_CTX;
    if(ctx.state==='suspended') ctx.resume();
    (BELL_PRESETS[id] || BELL_PRESETS.classic).play(ctx);
  }catch(e){ console.warn('Zil sesi çalınamadı:', e); }
}
function playKitchenBell(stationId){
  const setting = resolveBellSetting(stationId);
  if(typeof setting === 'string' && setting){
    try{
      const audio = new Audio(setting);
      audio.volume = 1.0;
      audio.play().catch(e => console.warn('Zil sesi çalınamadı:', e));
      return;
    }catch(e){ console.warn('Zil sesi çalınamadı:', e); }
  }
  const presetId = (setting && setting.preset) || 'classic';
  playBellPresetById(presetId);
}

/* Grid'i (masa/paket kartları + tutarları) APP.liveOrders'tan yeniden çizer -

function renderPayGrid(){

  const allTables = APP.config.zones.flatMap(z => z.tables);
  const tableRows = allTables.map(t => {
    const order = liveOrderForTable(t.id);
    const unpaid = order ? order.items.filter(i=>!i.paid) : [];
    if(unpaid.length===0) return null;
    const total = unpaid.reduce((s,i) => s+i.price*i.qty, 0);
    return `<div class="table-cell" style="cursor:pointer;background:rgba(244,63,94,.14);border-color:var(--red);color:var(--red);" onclick="openPayModal('${order.order_id}','${escapeHtml(t.name)}')">
      ${escapeHtml(t.name)}<div style="font-size:11px;margin-top:4px;font-weight:400;">${money(total)}</div></div>`;
  }).filter(Boolean);
  const pkgRows = (APP.liveOrders||[]).filter(o => o.kind==='takeaway' && o.items.filter(i=>!i.paid).length>0).map(o => {
    const unpaid = o.items.filter(i=>!i.paid);
    const total = unpaid.reduce((s,i)=>s+i.price*i.qty,0);
    const label = o.customer_name || ('Paket #'+(o.daily_number||''));
    return `<div class="table-cell" style="cursor:pointer;background:rgba(244,63,94,.14);border-color:var(--red);color:var(--red);overflow-wrap:anywhere;word-break:break-word;" onclick="openPayModal('${o.order_id}','${escapeHtml('📦 '+label)}')">
      📦 ${escapeHtml(label)}<div style="font-size:11px;margin-top:4px;font-weight:400;">${money(total)}</div></div>`;
  });
  const occupiedRows = tableRows.concat(pkgRows);
  grid.innerHTML = occupiedRows.length ? occupiedRows.join('') : '<p class="muted">Açık hesap yok.</p>';
}
/* Ödenecek ürünler adet bazında seçilebilir (örn. 4 Izgara Köfte'den sadece
   1'i) - sadece seçilen adetlerin tutarı için ödeme alınır, geri kalanı
   hesapta açık kalır (kısmi/ürün-adet bazlı ödeme). itemId -> seçili adet. */
let PAY_SELECTED_QTYS = {};
function openPayModal(orderId, tableName){
  const order = APP.liveOrders.find(o => o.order_id===orderId);
  if(!order) return;
  const unpaidItems = order.items.filter(i => !i.paid);
  PAY_SELECTED_QTYS = {};
  unpaidItems.forEach(i => { PAY_SELECTED_QTYS[i.id] = i.qty; });
  const subtotal = unpaidItems.reduce((s,i)=>s+i.price*i.qty,0);
  const itemsHtml = unpaidItems.map(it => `
    <div class="pay-item-row">
      <div class="row-top">
        <span>${escapeHtml(it.name)} <span class="muted" style="font-size:11px;">(${money(it.price)}/adet)</span></span>
        <span class="pay-item-subtotal" data-item-id="${it.id}" style="font-weight:700;">${money(it.price*it.qty)}</span>
      </div>
      <div class="row-bottom">
        <button type="button" class="qty-btn" onclick="stepPayItemQty('${it.id}',-1)">-</button>
        <span class="pay-item-qty" data-item-id="${it.id}" style="min-width:20px;text-align:center;font-weight:700;">${it.qty}</span>
        <button type="button" class="qty-btn" onclick="stepPayItemQty('${it.id}',1)">+</button>
        <span class="muted" style="font-size:11px;">/ ${it.qty} adet</span>
      </div>
    </div>`).join('');
  const bg = document.createElement('div');
  bg.id = 'payModalBg';
  bg.dataset.orderId = orderId;
  bg.dataset.tableName = tableName;
  bg.dataset.subtotal = String(subtotal);
  bg.dataset.discountAmount = '0';
  bg.dataset.tipAmount = '0';
  bg.dataset.redeemPoints = '0';
  bg.dataset.customerId = '';
  bg.dataset.customerPoints = '0';
  bg.dataset.isBirthdayToday = '0';
  bg.dataset.giftCardCode = '';
  bg.dataset.giftCardBalance = '0';
  bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;';
  bg.onclick = (e) => { if(e.target===bg) bg.remove(); };
  bg.innerHTML = `<div class="pay-modal">
    <div class="pay-modal-header">
      <h2>${escapeHtml(tableName)}</h2>
      <span class="pay-modal-close" onclick="document.getElementById('payModalBg').remove()">✕</span>
    </div>
    ${unpaidItems.length>1 ? `<div class="pay-select-all-row"><button class="pay-select-all-btn" onclick="toggleAllPayItems()">Tümünü Seç/Kaldır</button></div>` : ''}
    <div class="pay-items-card" id="payItemsWrap">${itemsHtml}</div>
    <div class="pay-subtotal-row" id="paySubtotalLine"><span>Ara Toplam</span><span>${money(subtotal)}</span></div>

    <div class="pay-options-grid">
      <div class="pay-option-card">
        <h4>🏷️ İndirim</h4>
        <div class="field-row">
          <input id="discValue" type="number" min="0" step="0.01" placeholder="0" style="flex:1;">
          <select id="discType" style="width:66px;padding:0 4px;">
            <option value="percent">%</option>
            <option value="amount">₺</option>
          </select>
          <button style="width:auto;padding:0 14px;margin:0;" onclick="applyPayDiscount()">Uygula</button>
        </div>
        <p id="discInfo" class="hint">İndirim yok</p>
      </div>
      <div class="pay-option-card">
        <h4>💸 Bahşiş</h4>
        <div class="pay-chip-row">
          <button type="button" class="pay-chip" onclick="applyTipPercent(5)">%5</button>
          <button type="button" class="pay-chip" onclick="applyTipPercent(10)">%10</button>
          <button type="button" class="pay-chip" onclick="applyTipPercent(15)">%15</button>
          <input id="tipValue" type="number" min="0" step="0.01" placeholder="Tutar" style="flex:1;min-width:80px;margin:0;" oninput="applyTipAmount(this.value)">

          <label class="hint" style="display:block;margin-bottom:4px;">Alınan nakit — üstü bahşiş olur</label>
          <input id="cashReceivedInput" type="number" min="0" step="0.01" placeholder="örn. 5000" style="margin:0;" oninput="handleCashReceivedInput(this.value)">

        <h4>🧑 Müşteri</h4>

        <h4>🎁 Hediye Kartı</h4>

          <button style="width:auto;padding:0 14px;margin:0;" onclick="lookupPayGiftCard()">Sorgula</button>
        </div>

        <div id="payGiftCardPartialActions" style="display:none;margin-top:8px;">
          <p class="hint" style="margin:0 0 6px;">Bakiye yetersiz — kartın tamamı düşülür, kalanı seçin:</p>
          <div class="field-row" style="gap:8px;">
            <button style="width:auto;padding:0 12px;margin:0;flex:1;" onclick="finishGiftCardPartial('cash')">💵 Kalanı Nakit</button>
            <button style="width:auto;padding:0 12px;margin:0;flex:1;" onclick="finishGiftCardPartial('card')">💳 Kalanı Kart</button>
          </div>
        </div>
      </div>
    </div>

    <div class="pay-total-banner">
      <span class="label">Ödenecek</span>
      <span class="amt" id="payFinalTotal">${money(subtotal)}</span>
    </div>
    <div class="pay-method-grid">
      <button class="pay-method-btn cash" onclick="finishPaymentFull('cash')">💵 Nakit</button>
      <button class="pay-method-btn card" onclick="finishPaymentFull('card')">💳 Kredi Kartı</button>
    </div>
    <div class="pay-method-grid secondary">
      <button class="pay-method-btn gift" id="payGiftCardPayBtn" disabled onclick="finishPaymentFull('gift_card')">🎁 Hediye Kartı ile Öde</button>
      <button class="pay-method-btn split" onclick="openSplitPay()">➗ Bölünmüş Ödeme</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
}
function applyTipPercent(pct){
  const bg = document.getElementById('payModalBg');
  const subtotal = parseFloat(bg.dataset.subtotal);
  const discAmount = parseFloat(bg.dataset.discountAmount||0);
  const base = Math.max(0, subtotal-discAmount);
  const tip = Math.round(base*pct/100*100)/100;
  bg.dataset.tipAmount = String(tip);
  document.getElementById('tipValue').value = tip;
  document.getElementById('tipInfo').textContent = 'Bahşiş: '+money(tip)+' (%'+pct+')';
  syncCashReceivedFromTip();
  updatePayFinalTotalLine();
}
function applyTipAmount(v){
  const bg = document.getElementById('payModalBg');
  let tip = parseFloat(v)||0;
  if(tip<0) tip=0;
  bg.dataset.tipAmount = String(tip);
  document.getElementById('tipInfo').textContent = tip>0 ? 'Bahşiş: '+money(tip) : 'Bahşiş yok';
  syncCashReceivedFromTip();
  updatePayFinalTotalLine();
}
/* "Müşteriden Alınan Nakit" alanı ile bahşiş alanı birbirini senkronize
   eder - hangisine yazılırsa diğeri ona göre güncellenir, ikisi de aynı
   şeyi (bahşiş tutarını) farklı bir açıdan ifade ediyor. */
function syncCashReceivedFromTip(){
  const bg = document.getElementById('payModalBg');
  const receivedInput = document.getElementById('cashReceivedInput');
  if(!receivedInput || document.activeElement===receivedInput) return;
  const tip = parseFloat(bg.dataset.tipAmount||0);
  const due = payFinalTotal();
  receivedInput.value = tip>0 ? (Math.round((due+tip)*100)/100) : '';
}
function handleCashReceivedInput(v){
  const bg = document.getElementById('payModalBg');
  const received = parseFloat(v)||0;
  const due = payFinalTotal();
  const tip = received>due ? Math.round((received-due)*100)/100 : 0;
  bg.dataset.tipAmount = String(tip);
  const tipValueInput = document.getElementById('tipValue');
  if(tipValueInput && document.activeElement!==tipValueInput) tipValueInput.value = tip || '';
  document.getElementById('tipInfo').textContent = tip>0 ? 'Bahşiş: '+money(tip)+' (alınan nakitten hesaplandı)' : 'Bahşiş yok';
  updatePayFinalTotalLine();
}
async function lookupPayCustomer(){
  const bg = document.getElementById('payModalBg');
  const phone = document.getElementById('payCustomerPhone').value.trim();
  const infoEl = document.getElementById('payCustomerInfo');
  const redeemWrap = document.getElementById('payRedeemWrap');
  if(!phone){ infoEl.textContent = 'Telefon girin'; return; }
  const session = getSession();
  const { data, error } = await sb.rpc('get_customer_by_phone', { p_token: session.session_token, p_phone: phone });
  if(error || !data){
    infoEl.textContent = 'Müşteri bulunamadı';
    bg.dataset.customerId = '';
    bg.dataset.customerPoints = '0';
    bg.dataset.redeemPoints = '0';
    bg.dataset.isBirthdayToday = '0';
    redeemWrap.style.display = 'none';
    updatePayFinalTotalLine();
    return;
  }
  bg.dataset.customerId = data.id;
  bg.dataset.customerPoints = String(data.points_balance||0);
  bg.dataset.isBirthdayToday = data.is_birthday_today ? '1' : '0';
  const loyalty = (APP.config && APP.config.loyalty) || {};
  const birthdayPct = loyalty.birthday_discount_percent || 0;
  infoEl.textContent = data.name + ' · ' + data.points_balance + ' puan' +
    (data.is_birthday_today && birthdayPct>0 ? ' · 🎂 Bugün doğum günü! %'+birthdayPct+' indirim uygulanacak' : '');
  if(loyalty.enabled && data.points_balance>0){
    redeemWrap.style.display = 'block';
    document.getElementById('payRedeemPoints').max = data.points_balance;
  } else {
    redeemWrap.style.display = 'none';
  }
  recomputePaySelection();
}
function applyRedeemPoints(v){
  const bg = document.getElementById('payModalBg');
  let pts = parseFloat(v)||0;
  const maxPts = parseFloat(bg.dataset.customerPoints||0);
  if(pts<0) pts=0; if(pts>maxPts) pts=maxPts;
  bg.dataset.redeemPoints = String(pts);
  recomputePaySelection();
}
async function lookupPayGiftCard(){
  const bg = document.getElementById('payModalBg');
  const code = document.getElementById('payGiftCardCode').value.trim();
  const infoEl = document.getElementById('payGiftCardInfo');
  const payBtn = document.getElementById('payGiftCardPayBtn');
  const partialBox = document.getElementById('payGiftCardPartialActions');
  if(!code){ infoEl.textContent = 'Kart kodu girin'; return; }
  const session = getSession();
  const { data, error } = await sb.rpc('check_gift_card', { p_token: session.session_token, p_code: code });
  if(error || !data){
    infoEl.textContent = error ? error.message : 'Kart bulunamadı';
    bg.dataset.giftCardCode = '';
    bg.dataset.giftCardBalance = '0';
    if(payBtn) payBtn.disabled = true;
    if(partialBox) partialBox.style.display = 'none';
    return;
  }
  bg.dataset.giftCardCode = data.code;
  bg.dataset.giftCardBalance = String(data.balance);
  const total = Math.round(payFinalTotal()*100)/100;
  const tip = parseFloat(bg.dataset.tipAmount||0);
  const amountWithTip = Math.round((total+tip)*100)/100;
  const remaining = Math.round((amountWithTip - data.balance)*100)/100;
  if(remaining > 0){
    // Bakiye yetmiyor: tam ödeme butonu yerine, kartın tamamını düşüp
    // kalanı nakit/kartla tamamlayan iki kısa yol gösterilir.
    infoEl.textContent = data.code + ' · Bakiye: ' + money(data.balance) + ' (yetersiz — kalan ' + money(remaining) + ')';
    if(payBtn) payBtn.disabled = true;
    if(partialBox){
      partialBox.style.display = '';
      partialBox.querySelector('p').textContent = 'Bakiye yetersiz — ' + money(data.balance) + ' düşülür, kalan ' + money(remaining) + ' için seçin:';
    }
  } else {
    infoEl.textContent = data.code + ' · Bakiye: ' + money(data.balance);
    if(payBtn) payBtn.disabled = false;
    if(partialBox) partialBox.style.display = 'none';
  }
}
async function finishGiftCardPartial(method){
  const bg = document.getElementById('payModalBg');
  const orderId = bg.dataset.orderId;
  const code = bg.dataset.giftCardCode;
  const balance = parseFloat(bg.dataset.giftCardBalance||0);
  if(!code){ alert('Önce bir hediye kartı sorgulayın'); return; }
  const itemQtys = buildPayItemQtys();
  if(itemQtys.length===0){ alert('Ödeme almak için en az bir ürün/adet seçin'); return; }
  const total = Math.round(payFinalTotal()*100)/100;
  const tip = parseFloat(bg.dataset.tipAmount||0);
  const amountWithTip = Math.round((total+tip)*100)/100;
  const giftAmount = Math.min(balance, amountWithTip);
  const remaining = Math.round((amountWithTip - giftAmount)*100)/100;
  const customerId = bg.dataset.customerId || null;
  const redeemPoints = parseFloat(bg.dataset.redeemPoints||0);
  await finishPayment(orderId, 'split', total, method==='cash'?remaining:0, method==='card'?remaining:0, parseFloat(bg.dataset.discountAmount||0), itemQtys, tip, customerId, redeemPoints, code, giftAmount);
}
function updatePayFinalTotalLine(){
  const bg = document.getElementById('payModalBg'); if(!bg) return;
  const net = payFinalTotal();
  const tip = parseFloat(bg.dataset.tipAmount||0);
  const el = document.getElementById('payFinalTotal');
  if(el) el.innerHTML = money(net+tip)+(tip>0?' <span style="font-size:12px;font-weight:600;color:var(--muted);">(bahşiş dahil)</span>':'');
}
function stepPayItemQty(itemId, delta){
  const bg = document.getElementById('payModalBg'); if(!bg) return;
  const order = APP.liveOrders.find(o => o.order_id===bg.dataset.orderId);
  const item = order && order.items.find(i => i.id===itemId);
  if(!item) return;
  const next = Math.max(0, Math.min(item.qty, (PAY_SELECTED_QTYS[itemId]||0) + delta));
  PAY_SELECTED_QTYS[itemId] = next;
  const qtyEl = document.querySelector('.pay-item-qty[data-item-id="'+itemId+'"]');
  if(qtyEl) qtyEl.textContent = next;
  const subEl = document.querySelector('.pay-item-subtotal[data-item-id="'+itemId+'"]');
  if(subEl) subEl.textContent = money(item.price*next);
  recomputePaySelection();
}
function toggleAllPayItems(){
  const bg = document.getElementById('payModalBg'); if(!bg) return;
  const order = APP.liveOrders.find(o => o.order_id===bg.dataset.orderId);
  const unpaid = order.items.filter(i => !i.paid);
  const allSelected = unpaid.every(i => (PAY_SELECTED_QTYS[i.id]||0) === i.qty);
  unpaid.forEach(i => {
    PAY_SELECTED_QTYS[i.id] = allSelected ? 0 : i.qty;
    const qtyEl = document.querySelector('.pay-item-qty[data-item-id="'+i.id+'"]');
    if(qtyEl) qtyEl.textContent = PAY_SELECTED_QTYS[i.id];
    const subEl = document.querySelector('.pay-item-subtotal[data-item-id="'+i.id+'"]');
    if(subEl) subEl.textContent = money(i.price*PAY_SELECTED_QTYS[i.id]);
  });
  recomputePaySelection();
}
function buildPayItemQtys(){
  return Object.keys(PAY_SELECTED_QTYS)
    .filter(id => PAY_SELECTED_QTYS[id]>0)
    .map(id => ({ item_id: id, qty: PAY_SELECTED_QTYS[id] }));
}
function recomputePaySelection(){
  const bg = document.getElementById('payModalBg'); if(!bg) return;
  const order = APP.liveOrders.find(o => o.order_id===bg.dataset.orderId);
  const subtotal = order.items.reduce((s,i) => s + i.price*(PAY_SELECTED_QTYS[i.id]||0), 0);
  bg.dataset.subtotal = String(subtotal);
  document.getElementById('paySubtotalLine').textContent = 'Ara Toplam: '+money(subtotal);
  // İndirim varsa yeni seçime göre yeniden hesaplanır (yüzdeyse orana göre, tutarsa ara toplamı geçmeyecek şekilde).
  const discType = bg.dataset.discountType;
  const discValue = parseFloat(bg.dataset.discountValue||0);
  let discAmount = 0;
  if(discType==='percent') discAmount = subtotal*discValue/100;
  else if(discType==='amount') discAmount = discValue;
  if(discAmount>subtotal) discAmount = subtotal;
  bg.dataset.discountAmount = String(discAmount);
  const discInfo = document.getElementById('discInfo');
  if(discInfo) discInfo.textContent = discAmount>0 ? ('İndirim: -'+money(discAmount)+(discType==='percent'?' (%'+discValue+')':'')) : 'İndirim yok';
  updatePayFinalTotalLine();
}
function applyPayDiscount(){
  const bg = document.getElementById('payModalBg');
  const type = document.getElementById('discType').value;
  let val = parseFloat(document.getElementById('discValue').value)||0;
  if(val<0) val=0;
  bg.dataset.discountType = type;
  bg.dataset.discountValue = String(val);
  recomputePaySelection();
}
function payFinalTotal(){
  const bg = document.getElementById('payModalBg');
  const subtotal = parseFloat(bg.dataset.subtotal);
  const discountAmount = parseFloat(bg.dataset.discountAmount||0);
  const redeemPoints = parseFloat(bg.dataset.redeemPoints||0);
  const pointValue = (APP.config && APP.config.loyalty && APP.config.loyalty.point_value) || 1;
  const afterDiscounts = Math.max(0, subtotal - discountAmount - redeemPoints*pointValue);
  const birthdayPct = bg.dataset.isBirthdayToday==='1' ? ((APP.config && APP.config.loyalty && APP.config.loyalty.birthday_discount_percent) || 0) : 0;
  return Math.max(0, afterDiscounts - afterDiscounts*birthdayPct/100);
}
async function finishPaymentFull(method){
  const bg = document.getElementById('payModalBg');
  const orderId = bg.dataset.orderId;
  const itemQtys = buildPayItemQtys();
  if(itemQtys.length===0){ alert('Ödeme almak için en az bir ürün/adet seçin'); return; }
  const total = Math.round(payFinalTotal()*100)/100;
  const tip = parseFloat(bg.dataset.tipAmount||0);
  const amountWithTip = Math.round((total+tip)*100)/100;
  const customerId = bg.dataset.customerId || null;
  const redeemPoints = parseFloat(bg.dataset.redeemPoints||0);
  if(method==='gift_card'){
    const code = bg.dataset.giftCardCode;
    const balance = parseFloat(bg.dataset.giftCardBalance||0);
    if(!code){ alert('Önce bir hediye kartı sorgulayın'); return; }
    if(balance < amountWithTip){ alert('Hediye kartında yeterli bakiye yok (bakiye: '+money(balance)+', gereken: '+money(amountWithTip)+')'); return; }
    await finishPayment(orderId, method, total, 0, 0, parseFloat(bg.dataset.discountAmount||0), itemQtys, tip, customerId, redeemPoints, code, amountWithTip);
    return;
  }
  await finishPayment(orderId, method, total, method==='cash'?amountWithTip:0, method==='card'?amountWithTip:0, parseFloat(bg.dataset.discountAmount||0), itemQtys, tip, customerId, redeemPoints);
}
function openSplitPay(){
  const bg = document.getElementById('payModalBg');

        <div class="field-row" style="margin-bottom:10px;">
