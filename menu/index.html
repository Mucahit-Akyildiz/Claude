<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Menü</title>
<link rel="icon" type="image/png" href="/assets/images/favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f7f5; --panel:#ffffff; --panel2:#eef1f1; --border:#dfe3e2;
    --text:#25282b; --muted:#5d6568;
    --accent:#008fa8; --accent2:#c9a45c; --green:#0d7a4f; --red:#c0392b;
    --btn-ink:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#181c1e; --panel:#20262a; --panel2:#2a3136; --border:#39424a;
      --text:#f1f3f7; --muted:#93a0a3;
      --accent:#00b6d4; --accent2:#d4b06e; --green:#22c55e; --red:#f43f5e;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px;}
  header{display:flex;align-items:center;gap:10px;padding:16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
  header img{width:34px;height:34px;border-radius:8px;}
  header .titles{flex:1;min-width:0;}
  header h1{font-size:16px;margin:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  header p{margin:0;font-size:12.5px;color:var(--muted);}
  .lang-picker{display:flex;gap:4px;flex-shrink:0;}
  .lang-btn{border:1.5px solid var(--border);background:var(--panel2);color:var(--muted);border-radius:8px;padding:5px 8px;font-size:11.5px;font-weight:700;cursor:pointer;}
  .lang-btn.active{background:var(--accent);color:var(--btn-ink);border-color:var(--accent);}
  html[dir="rtl"] .qty-btn,html[dir="rtl"] .cartbar-row{direction:ltr;}
  main{padding:14px;max-width:520px;margin:0 auto;}
  .station-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 8px;}
  .station-title:first-child{margin-top:4px;}
  .product-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
  .product-card.sold-out{opacity:.6;}
  .sold-badge{font-size:12px;font-weight:800;color:var(--red);border:1px solid var(--red);border-radius:999px;padding:4px 10px;white-space:nowrap;}
  .stock-left{color:var(--red);font-weight:700;}
  .product-name{flex:1;min-width:0;font-weight:700;font-size:14.5px;overflow-wrap:anywhere;word-break:break-word;}
  .product-price{color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;}
  .qty-btn{width:32px;height:32px;flex-shrink:0;border-radius:9px;border:1.5px solid var(--border);background:var(--panel2);color:var(--text);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .qty-btn:active{transform:scale(.94);}
  .qty-val{min-width:20px;text-align:center;font-weight:800;font-size:14px;}
  .cartbar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--border);padding:12px 16px;box-shadow:0 -6px 20px rgba(0,0,0,.08);display:none;}
  .cartbar.show{display:block;}
  .cartbar-row{display:flex;justify-content:space-between;align-items:center;max-width:520px;margin:0 auto;gap:10px;}
  .cartbar button{background:var(--accent);color:var(--btn-ink);border:none;border-radius:12px;padding:13px 18px;font-weight:800;font-size:14.5px;cursor:pointer;flex-shrink:0;}
  .cartbar-total{font-weight:800;font-size:15px;}
  .center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;}
  .state-box{max-width:340px;}
  .state-box img{width:56px;height:56px;margin-bottom:14px;border-radius:12px;}
  .state-box h2{margin:0 0 8px;font-size:18px;}
  .state-box p{color:var(--muted);font-size:14px;line-height:1.5;}
  .waiter-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 16px 0;padding:10px 12px;background:var(--panel);border:1px solid var(--border);border-radius:14px;font-weight:700;font-size:14px;}
  .waiter-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .waiter-btns button{width:auto;margin:0;padding:9px 12px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--btn-ink,#fff);font-weight:700;font-size:13.5px;cursor:pointer;}
  .waiter-btns button + button{background:transparent;color:var(--accent);}
  .waiter-btns button:disabled{opacity:.55;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:var(--panel);border-radius:18px;padding:20px;max-width:380px;width:100%;max-height:85vh;overflow:auto;}
  .modal h2{margin:0 0 12px;font-size:17px;}
  .modal input{width:100%;background:var(--panel2);border:1.5px solid var(--border);color:var(--text);border-radius:10px;padding:11px 13px;font-size:14.5px;margin-bottom:10px;font-family:inherit;}
  .modal .item-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;border-top:1px dashed var(--border);}
  .modal button.primary{width:100%;background:var(--accent);color:var(--btn-ink);border:none;border-radius:12px;padding:13px;font-weight:800;font-size:14.5px;cursor:pointer;margin-top:8px;}
  .modal button.ghost{width:100%;background:transparent;color:var(--text);border:1.5px solid var(--border);border-radius:12px;padding:11px;font-weight:700;font-size:13.5px;cursor:pointer;margin-top:8px;}
  .err{color:var(--red);font-size:13px;margin-top:4px;min-height:16px;}
  .empty-msg{color:var(--muted);text-align:center;padding:30px 0;font-size:14px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL = 'https://dveybagnrgofxkqangvo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7gHhsaPYOzOddFnpjntPKw_S3Mgg3V8';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const QR_TOKEN = new URLSearchParams(window.location.search).get('t');
const STATE = { menu: null, cart: {} };

/* Çok dilli QR menü: ürün adları restoranın girdiği çevirilerden gelir
   (bkz. app/index.html > Ayarlar > Ürünler > 🌐 Çeviri, get_public_menu'nün
   döndürdüğü name_translations), arayüz metinleri ise burada sabit -
   seçilen dil tarayıcıda hatırlanır (localStorage), her masada/ziyarette
   tekrar sorulmaz. */
const LANGS = [
  { code:'tr', label:'TR' },
  { code:'en', label:'EN' },
  { code:'ar', label:'AR' },
  { code:'de', label:'DE' },
  { code:'ru', label:'RU' },
];
const I18N = {
  tr: { invalidTitle:'Geçersiz Bağlantı', invalidMsg:'Bu sayfaya masadaki QR kodu okutarak ulaşmalısınız.', errorTitle:'Menü Yüklenemedi', errorMsg:'Bir hata oluştu, lütfen personelden yardım isteyin.', emptyMenu:'Şu anda menüde satışa açık ürün yok.', other:'Diğer', sendCart:'Sepeti Gönder →', items:'ürün', checkoutTitle:'Siparişi Onayla', total:'Toplam', namePlaceholder:'Adınız (opsiyonel)', sendRequest:'İsteği Gönder', sending:'Gönderiliyor...', back:'Geri Dön', successTitle:'İsteğiniz Alındı', successMsg:'Siparişiniz personelimize iletildi, onaylandığında hazırlanmaya başlanacak. Afiyet olsun!', privacyNotice:'Adınızı girerseniz, siparişinizi iletmek amacıyla <a href="/gizlilik/" target="_blank" rel="noopener">Gizlilik Politikamız</a> kapsamında işlenir.' },
  en: { invalidTitle:'Invalid Link', invalidMsg:'Please scan the QR code on your table to reach this page.', errorTitle:'Menu Could Not Load', errorMsg:'Something went wrong, please ask a staff member for help.', emptyMenu:'There are no items available right now.', other:'Other', sendCart:'Send Cart →', items:'items', checkoutTitle:'Confirm Order', total:'Total', namePlaceholder:'Your name (optional)', sendRequest:'Send Request', sending:'Sending...', back:'Go Back', successTitle:'Request Received', successMsg:'Your order has been sent to our staff and will be prepared once approved. Enjoy your meal!', privacyNotice:'If you enter your name, it will be processed to deliver your order under our <a href="/gizlilik/" target="_blank" rel="noopener">Privacy Policy</a>.' },
  ar: { invalidTitle:'رابط غير صالح', invalidMsg:'يرجى مسح رمز QR الموجود على طاولتك للوصول إلى هذه الصفحة.', errorTitle:'تعذر تحميل القائمة', errorMsg:'حدث خطأ ما، يرجى طلب المساعدة من أحد الموظفين.', emptyMenu:'لا توجد عناصر متاحة حاليًا.', other:'أخرى', sendCart:'إرسال السلة ←', items:'عناصر', checkoutTitle:'تأكيد الطلب', total:'المجموع', namePlaceholder:'اسمك (اختياري)', sendRequest:'إرسال الطلب', sending:'جارٍ الإرسال...', back:'رجوع', successTitle:'تم استلام طلبك', successMsg:'تم إرسال طلبك إلى فريقنا وسيتم تحضيره بعد الموافقة. بالهناء والشفاء!', privacyNotice:'إذا أدخلت اسمك، فستتم معالجته لتوصيل طلبك بموجب <a href="/gizlilik/" target="_blank" rel="noopener">سياسة الخصوصية</a> الخاصة بنا.' },
  de: { invalidTitle:'Ungültiger Link', invalidMsg:'Bitte scannen Sie den QR-Code auf Ihrem Tisch, um diese Seite zu erreichen.', errorTitle:'Menü konnte nicht geladen werden', errorMsg:'Etwas ist schiefgelaufen, bitte fragen Sie das Personal um Hilfe.', emptyMenu:'Derzeit sind keine Artikel verfügbar.', other:'Sonstiges', sendCart:'Warenkorb senden →', items:'Artikel', checkoutTitle:'Bestellung bestätigen', total:'Gesamt', namePlaceholder:'Ihr Name (optional)', sendRequest:'Anfrage senden', sending:'Wird gesendet...', back:'Zurück', successTitle:'Anfrage erhalten', successMsg:'Ihre Bestellung wurde an unser Personal gesendet und wird nach Bestätigung zubereitet. Guten Appetit!', privacyNotice:'Wenn Sie Ihren Namen eingeben, wird er zur Zustellung Ihrer Bestellung gemäß unserer <a href="/gizlilik/" target="_blank" rel="noopener">Datenschutzrichtlinie</a> verarbeitet.' },
  ru: { invalidTitle:'Недействительная ссылка', invalidMsg:'Пожалуйста, отсканируйте QR-код на вашем столике, чтобы попасть на эту страницу.', errorTitle:'Не удалось загрузить меню', errorMsg:'Что-то пошло не так, обратитесь за помощью к персоналу.', emptyMenu:'Сейчас нет доступных позиций.', other:'Другое', sendCart:'Отправить заказ →', items:'позиций', checkoutTitle:'Подтвердить заказ', total:'Итого', namePlaceholder:'Ваше имя (необязательно)', sendRequest:'Отправить запрос', sending:'Отправка...', back:'Назад', successTitle:'Запрос получен', successMsg:'Ваш заказ передан персоналу и будет готовиться после подтверждения. Приятного аппетита!', privacyNotice:'Если вы укажете своё имя, оно будет обработано для доставки заказа согласно нашей <a href="/gizlilik/" target="_blank" rel="noopener">Политике конфиденциальности</a>.' },
};
function getLang(){
  try {
    const saved = localStorage.getItem('rys_menu_lang');
    if(saved && I18N[saved]) return saved;
  } catch(e){}
  return 'tr';
}
function setLang(code){
  if(!I18N[code]) return;
  try { localStorage.setItem('rys_menu_lang', code); } catch(e){}
  STATE.lang = code;
  document.documentElement.setAttribute('lang', code);
  document.documentElement.setAttribute('dir', code==='ar' ? 'rtl' : 'ltr');
  if(STATE.menu) renderMenu(); else init();
}
function t(key){ return (I18N[STATE.lang||'tr'] && I18N[STATE.lang||'tr'][key]) || I18N.tr[key] || key; }
function productName(p){
  if(STATE.lang==='tr' || !STATE.lang) return p.name;
  return (p.name_translations && p.name_translations[STATE.lang]) || p.name;
}
STATE.lang = getLang();
document.documentElement.setAttribute('lang', STATE.lang);
document.documentElement.setAttribute('dir', STATE.lang==='ar' ? 'rtl' : 'ltr');

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function money(n){ return (Math.round((n||0)*100)/100).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' TL'; }
function langPickerHtml(){
  return `<div class="lang-picker">${LANGS.map(l => `<button type="button" class="lang-btn ${STATE.lang===l.code?'active':''}" onclick="setLang('${l.code}')">${l.label}</button>`).join('')}</div>`;
}

function renderState(html){ document.getElementById('app').innerHTML = html; }

async function init(){
  if(!QR_TOKEN){
    renderState(stateBoxHtml('⚠️', t('invalidTitle'), t('invalidMsg')));
    return;
  }
  const { data, error } = await sb.rpc('get_public_menu', { p_qr_token: QR_TOKEN });
  if(error || !data){
    renderState(stateBoxHtml('⚠️', t('errorTitle'), (error && error.message) || t('errorMsg')));
    return;
  }
  STATE.menu = data;
  renderMenu();
}
function stateBoxHtml(icon, title, msg){
  return `<div style="padding:16px;display:flex;justify-content:flex-end;">${langPickerHtml()}</div>
    <div class="center-wrap" style="min-height:calc(100vh - 66px);"><div class="state-box"><div style="font-size:40px;">${icon}</div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(msg)}</p></div></div>`;
}

function renderMenu(){
  // İşletmede "QR Menü ile Müşteri Siparişi" eklentisi yoksa menü sadece
  // görüntülenir; sepet/sipariş arayüzü gösterilmez.
  const canOrder = STATE.menu && STATE.menu.qr_ordering_enabled !== false;
  const m = STATE.menu;
  const products = m.products || [];
  if(products.length===0){
    renderState(headerHtml() + '<main><p class="empty-msg">'+escapeHtml(t('emptyMenu'))+'</p></main>');
    return;
  }
  const groups = {};
  const order = [];
  products.forEach(p => {
    const key = p.station_name || t('other');
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(p);
  });
  const body = order.map(key => `
    <div class="station-title">${escapeHtml(key)}</div>
    ${groups[key].map(p => `
      <div class="product-card ${p.max_qty===0?'sold-out':''}">
        <div class="product-name">${escapeHtml(productName(p))}<div class="product-price">${money(p.price)}${p.max_qty!=null && p.max_qty>0 && p.max_qty<=5 ? ` · <span class="stock-left">${escapeHtml(stockTxt('left', p.max_qty))}</span>` : ''}</div></div>
        ${p.max_qty===0 ? `<span class="sold-badge">${escapeHtml(stockTxt('sold'))}</span>` : canOrder ? `<button class="qty-btn" onclick="stepCart('${p.id}',-1)">-</button>
        <span class="qty-val" id="qty_${p.id}">${STATE.cart[p.id]||0}</span>
        <button class="qty-btn" onclick="stepCart('${p.id}',1)">+</button>` : ''}
      </div>`).join('')}
  `).join('');
  renderState(headerHtml() + `<main>${body}</main>
    ${!canOrder ? '' : `<div class="cartbar" id="cartbar">
      <div class="cartbar-row">
        <span class="cartbar-total" id="cartTotal">${money(0)}</span>
        <button onclick="openCheckout()">${escapeHtml(t('sendCart'))}</button>
      </div>
    </div>`}`);
  updateCartBar();
}
const TRUST_I18N = {
  tr: { verified:'✓ Doğrulanmış işletme', safety:'🔒 Bu sayfa hiçbir zaman kart, şifre veya kimlik bilgisi istemez. Ödemeyi işletme personeline yapın. Adres çubuğunda peyktan.com olduğundan emin olun.' },
  en: { verified:'✓ Verified business', safety:'🔒 This page never asks for card, password or ID details. Pay the restaurant staff directly. Make sure the address bar shows peyktan.com.' },
  ar: { verified:'✓ نشاط تجاري موثّق', safety:'🔒 هذه الصفحة لا تطلب أبدًا بيانات البطاقة أو كلمة المرور أو الهوية. ادفع لموظفي المطعم مباشرة. تأكد من أن شريط العنوان يعرض peyktan.com.' },
  de: { verified:'✓ Verifiziertes Unternehmen', safety:'🔒 Diese Seite fragt niemals nach Karten-, Passwort- oder Ausweisdaten. Bezahlen Sie direkt beim Personal. Achten Sie darauf, dass in der Adressleiste peyktan.com steht.' },
  ru: { verified:'✓ Проверенное заведение', safety:'🔒 Эта страница никогда не запрашивает данные карты, пароли или документы. Оплачивайте напрямую персоналу. Убедитесь, что в адресной строке указан peyktan.com.' }
};
function trt(k){ return (TRUST_I18N[STATE.lang] || TRUST_I18N.tr)[k] || TRUST_I18N.tr[k]; }
function trustHtml(){
  const m = STATE.menu || {};
  return `<div style="padding:10px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);">
    ${m.restaurant_verified ? `<div style="color:var(--accent);font-weight:700;margin-bottom:2px;">${escapeHtml(trt('verified'))}${m.restaurant_title ? ' · '+escapeHtml(m.restaurant_title) : ''}</div>` : ''}
    ${m.restaurant_address ? `<div style="margin-bottom:4px;">📍 ${escapeHtml(m.restaurant_address)}</div>` : ''}
    <div>${escapeHtml(trt('safety'))}</div>
  </div>`;
}
const WAITER_I18N = {
  tr: { title:'Garson Çağır', order:'🙋 Sipariş için', payment:'💳 Hesap / Ödeme için', ok:'Garsonunuz geliyor, teşekkürler!', already:'Garsonunuz zaten çağrıldı, birazdan yanınızda.' },
  en: { title:'Call Waiter', order:'🙋 To order', payment:'💳 For the bill', ok:'Your waiter is on the way, thank you!', already:'Your waiter has already been called.' },
  ar: { title:'استدعاء النادل', order:'🙋 للطلب', payment:'💳 للحساب', ok:'النادل في الطريق إليك، شكراً!', already:'تم استدعاء النادل بالفعل.' },
  de: { title:'Kellner rufen', order:'🙋 Zum Bestellen', payment:'💳 Zum Bezahlen', ok:'Ihr Kellner kommt gleich, danke!', already:'Ihr Kellner wurde bereits gerufen.' },
  ru: { title:'Вызвать официанта', order:'🙋 Сделать заказ', payment:'💳 Попросить счёт', ok:'Официант уже идёт, спасибо!', already:'Официант уже вызван.' },
};
function wt(key){ return (WAITER_I18N[STATE.lang||'tr']||WAITER_I18N.tr)[key] || WAITER_I18N.tr[key]; }
function waiterHtml(){
  return `<div class="waiter-bar"><span>${escapeHtml(wt('title'))}</span>
    <div class="waiter-btns"><button type="button" onclick="callWaiter('order', this)">${escapeHtml(wt('order'))}</button>
    <button type="button" onclick="callWaiter('payment', this)">${escapeHtml(wt('payment'))}</button></div></div>`;
}
async function callWaiter(kind, btn){
  if(btn) btn.disabled = true;
  const { data, error } = await sb.rpc('call_waiter', { p_qr_token: QR_TOKEN, p_kind: kind });
  setTimeout(() => { if(btn) btn.disabled = false; }, 8000);
  if(error){ alert(error.message); if(btn) btn.disabled = false; return; }
  alert(data && data.already ? wt('already') : wt('ok'));
}
function headerHtml(){
  const m = STATE.menu;
  return `<header>
    <img src="/assets/images/logo.webp" alt="Peyktan">
    <div class="titles"><h1>${escapeHtml(m.restaurant_name)}</h1><p>${escapeHtml(m.table_name)}</p></div>
    ${langPickerHtml()}
  </header>` + waiterHtml() + trustHtml();
}
const STOCK_I18N = { sold: {"tr": "Tükendi", "en": "Sold out", "ar": "نفد", "de": "Ausverkauft", "ru": "Нет в наличии"}, left: {"tr": "Son {n}", "en": "{n} left", "ar": "متبقي {n}", "de": "Noch {n}", "ru": "Осталось {n}"} };
function stockTxt(k, n){ const d = STOCK_I18N[k]; return (d[STATE.lang||'tr'] || d.tr).replace('{n}', n); }
function maxQtyOf(productId){ const p = ((STATE.menu||{}).products||[]).find(x => x.id===productId); return p && p.max_qty != null ? Math.max(0, p.max_qty) : 20; }
function stepCart(productId, delta){
  // Stokta kalandan fazlası seçilemez (bkz. max_qty: hammadde/ürün stoğu).
  const next = Math.max(0, Math.min(20, maxQtyOf(productId), (STATE.cart[productId]||0) + delta));
  if(next===0) delete STATE.cart[productId]; else STATE.cart[productId] = next;
  const el = document.getElementById('qty_'+productId);
  if(el) el.textContent = next;
  updateCartBar();
}
function updateCartBar(){
  const bar = document.getElementById('cartbar'); if(!bar) return;
  const ids = Object.keys(STATE.cart);
  if(ids.length===0){ bar.classList.remove('show'); return; }
  bar.classList.add('show');
  const products = STATE.menu.products || [];
  let total = 0;
  ids.forEach(id => {
    const p = products.find(x => x.id===id);
    if(p) total += p.price * STATE.cart[id];
  });
  document.getElementById('cartTotal').textContent = money(total) + ' · ' + ids.reduce((s,id)=>s+STATE.cart[id],0) + ' ' + t('items');
}
function openCheckout(){
  const ids = Object.keys(STATE.cart);
  if(ids.length===0) return;
  const products = STATE.menu.products || [];
  const rows = ids.map(id => {
    const p = products.find(x => x.id===id);
    return p ? { p, qty: STATE.cart[id] } : null;
  }).filter(Boolean);
  const total = rows.reduce((s,r) => s+r.p.price*r.qty, 0);
  const bg = document.createElement('div');
  bg.id = 'checkoutBg';
  bg.className = 'modal-bg';
  bg.onclick = (e) => { if(e.target===bg) bg.remove(); };
  bg.innerHTML = `<div class="modal">
    <h2>${escapeHtml(t('checkoutTitle'))}</h2>
    ${rows.map(r => `<div class="item-row"><span>${r.qty}x ${escapeHtml(productName(r.p))}</span><span>${money(r.p.price*r.qty)}</span></div>`).join('')}
    <div class="item-row" style="font-weight:800;border-top:1px solid var(--border);"><span>${escapeHtml(t('total'))}</span><span>${money(total)}</span></div>
    <input id="ckName" placeholder="${escapeHtml(t('namePlaceholder'))}" style="margin-top:14px;">
    <p class="muted" style="font-size:11px;margin-top:6px;">${t('privacyNotice')}</p>
    <div class="err" id="ckErr"></div>
    <button class="primary" id="ckSendBtn" onclick="sendCustomerOrder()">${escapeHtml(t('sendRequest'))}</button>
    <button class="ghost" onclick="document.getElementById('checkoutBg').remove()">${escapeHtml(t('back'))}</button>
  </div>`;
  document.body.appendChild(bg);
}
async function sendCustomerOrder(){
  const ids = Object.keys(STATE.cart);
  const items = ids.map(id => ({ product_id: id, qty: STATE.cart[id] }));
  const name = document.getElementById('ckName').value.trim();
  const btn = document.getElementById('ckSendBtn');
  const errEl = document.getElementById('ckErr');
  errEl.textContent = '';
  btn.disabled = true; btn.textContent = t('sending');
  const { error } = await sb.rpc('submit_customer_order_request', { p_qr_token: QR_TOKEN, p_customer_name: name||null, p_items: items });
  btn.disabled = false; btn.textContent = t('sendRequest');
  if(error){ errEl.textContent = error.message; return; }
  STATE.cart = {};
  const bg = document.getElementById('checkoutBg'); if(bg) bg.remove();
  renderState(stateBoxHtml('✅', t('successTitle'), t('successMsg')));
}
init();
</script>
</body>
