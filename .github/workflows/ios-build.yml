name: Mobil Uygulama Derle (iOS)

# Apple geliştirici hesabı olmadan: uygulama simülatör için derlenir, iPhone simülatöründe açılıp
# ekran görüntüsü alınır (test). İmzalı IPA / TestFlight için Apple hesabı + sertifika gerekir.
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/restoran-app-definition-h5e5am
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches:
      - claude/restoran-app-definition-h5e5am
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build-ios-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install
      - run: npx cap sync ios

      - name: Simülatör için derle
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
          test -d build/Build/Products/Debug-iphonesimulator/App.app

      - name: iPhone simülatöründe aç ve ekran görüntüsü al
        working-directory: mobile/ios/App
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEV" com.peyktan.app
          sleep 25
          xcrun simctl io "$DEV" screenshot ios-ekran.png
          # Uygulama hâlâ çalışıyor mu (açılışta çökme yok)?
          xcrun simctl spawn "$DEV" launchctl list | grep -q com.peyktan.app

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: peyktan-ios-test
          path: |
            mobile/ios/App/ios-ekran.png
            mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
