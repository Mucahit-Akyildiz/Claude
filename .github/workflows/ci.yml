name: Temel Kontroller (Syntax)

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/restoran-app-definition-h5e5am
  pull_request:
    branches:
      - claude/restoran-app-definition-h5e5am

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: package.json geçerliliğini kontrol et
        run: node -e "require('./package.json')"

      - name: Satır içi JavaScript kontrolü (güvenlik politikası)
        run: node scripts/check-inline-handlers.js

      - name: Ödeme API testleri (iyzico/Supabase taklit edilir)
        run: node --test tests/api/*.test.js

      - name: JavaScript dosyalarının sözdizimi kontrolü
        run: |
          for f in $(find api app/js assets/js siparis menu hesap-silme rezervasyon degerlendirme takip -name '*.js'); do
            echo "checking $f"
            node --check "$f" || exit 1
          done

      - name: app/index.html içindeki <script> bloklarının sözdizimi kontrolü
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('app/index.html', 'utf8');
            const re = /<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi;
            let m, i = 0, hadError = false;
            while ((m = re.exec(html))) {
              i++;
              try { new Function(m[1]); }
              catch (e) { console.error('Script block', i, 'sözdizimi hatası:', e.message); hadError = true; }
            }
            if (hadError) process.exit(1);
            console.log(i + ' inline <script> bloğu kontrol edildi, sorun yok.');
          "

  ui-tests:
    # Arayüz duman testleri: uygulama gerçek Chromium'da açılır, Supabase taklit edilir
    # (tests/ui/fake-supabase.js). Ana ekranlar, ödeme/sipariş/kurye pencereleri ve
    # herkese açık sayfalar gezilir; herhangi bir JS hatası CI'ı kırar.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Playwright kur
        run: npm install --no-save --no-package-lock playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Arayüz testleri
        run: node tests/ui/smoke.cjs
