name: Mobil Uygulama Derle (Android)

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/restoran-app-definition-h5e5am
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # Varsayılan paket listesi artık kaldırılmış eski bir 'tools'
          # paketini de kurmaya çalışıp hata veriyordu - sadece gerçekten
          # ihtiyaç duyulan paketleri açıkça belirtiyoruz.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - run: npm install
      - run: npx cap sync android

      - name: APK derle (imzasız - test/kurulum için yeterli)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: letayif-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
