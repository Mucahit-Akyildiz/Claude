name: Mobil Uygulama Derle (Android)

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/restoran-app-definition-h5e5am
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches:
      - claude/restoran-app-definition-h5e5am
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node -e "require('./package.json')"
      - run: |
          for f in $(find . -name '*.js' -not -path './node_modules/*' -not -path './android/*' -not -path './ios/*'); do
            node --check "$f" || exit 1
          done

  build-android-apk:
    runs-on: ubuntu-latest
    # GitHub Actions, 'if:' kosullarinda dogrudan secrets baglamina izin
    # vermiyor ("Unrecognized named-value: 'secrets'" hatasi - is/job hic
    # baslamadan tum çalıştırma anında basarisiz oluyordu). Bu yuzden
    # keystore secret'ini once job seviyesinde env'e atayip asagidaki
    # if: kosullarinda env baglamini kullaniyoruz (bu her zaman izinli).
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.PEYKTAN_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # Varsayılan paket listesi artık kaldırılmış eski bir 'tools'
          # paketini de kurmaya çalışıp hata veriyordu - sadece gerçekten
          # ihtiyaç duyulan paketleri açıkça belirtiyoruz.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - run: npm install
      - run: npx cap sync android

      - name: APK derle (imzasız - test/kurulum için yeterli)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: peyktan-android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Yayın keystore'unu çöz
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        working-directory: mobile/android/app
        run: echo "${{ secrets.PEYKTAN_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: İmzalı AAB derle (Play Store için)
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        working-directory: mobile/android
        env:
          PEYKTAN_KEYSTORE_PATH: app/release.keystore
          PEYKTAN_KEYSTORE_PASSWORD: ${{ secrets.PEYKTAN_KEYSTORE_PASSWORD }}
          PEYKTAN_KEY_ALIAS: ${{ secrets.PEYKTAN_KEY_ALIAS }}
          PEYKTAN_KEY_PASSWORD: ${{ secrets.PEYKTAN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          # İmzasız AAB Play Console'a yüklenemez - imza yoksa derleme başarısız olsun.
          if ! jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified"; then
            echo "::error::AAB imzalanmamış (keystore bulunamadı veya bilgiler hatalı)"; exit 1
          fi
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab | grep -m1 "X.509" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        with:
          name: peyktan-android-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
