name: Masaüstü Uygulaması Derle

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/restoran-app-definition-h5e5am
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    branches:
      - claude/restoran-app-definition-h5e5am
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node -e "require('./package.json')"
      - run: |
          for f in $(find . -name '*.js' -not -path './node_modules/*' -not -path './dist/*'); do
            node --check "$f" || exit 1
          done

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: peyktan-windows
          path: desktop/dist/*.exe

  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: peyktan-mac
          path: desktop/dist/*.dmg
