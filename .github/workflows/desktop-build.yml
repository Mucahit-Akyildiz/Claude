name: Masaüstü Uygulaması Derle

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/restoran-app-definition-h5e5am
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    branches:
      - claude/restoran-app-definition-h5e5am
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-build.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node -e "require('./package.json')"
      - run: |
          for f in $(find . -name '*.js' -not -path './node_modules/*' -not -path './dist/*'); do
            node --check "$f" || exit 1
          done

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: peyktan-windows
          path: desktop/dist/*.exe

  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: peyktan-mac
          path: desktop/dist/*.dmg

  # Ana dala her birleşmede kurulum dosyaları sabit adlarla "masaustu" sürümüne yüklenir;
  # sitedeki indirme bağlantıları (releases/download/masaustu/...) hep en güncel sürümü verir.
  publish:
    if: github.event_name != 'pull_request'
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dl
      - name: Sabit adlarla yeniden adlandır
        run: |
          mkdir out
          cp dl/peyktan-windows/*.exe out/Peyktan-Kurulum.exe
          cp dl/peyktan-mac/*.dmg out/Peyktan.dmg
          ls -la out
      - name: Masaüstü sürümünü güncelle (masaustu etiketi)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view masaustu >/dev/null 2>&1; then
            gh release create masaustu --title "Peyktan Masaüstü" --notes "Windows ve macOS kurulum dosyaları. peyktan.com/#indir" --latest=false
          fi
          gh release upload masaustu out/Peyktan-Kurulum.exe out/Peyktan.dmg --clobber
