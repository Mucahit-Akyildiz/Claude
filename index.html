<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restoran Yönetim Sistemi</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---- Sidebar: sabit, marka rengi, temadan bağımsız ---- */
  :root{
    --sb-bg: linear-gradient(180deg,#1a1130 0%,#140d24 100%);
    --sb-text:#efe9ff; --sb-muted:#a698d1; --sb-border:rgba(255,255,255,.08);
    --sb-active:#2a1f4d; --sb-accent:#ff5d3a;
    --radius:18px;
  }
  /* ---- Koyu tema (varsayılan) ---- */
  :root, :root[data-theme="dark"]{
    --bg:#14161c; --panel:#1c1f27; --panel2:#262a35; --border:#333947;
    --text:#f1f3f7; --muted:#8b93a3;
    --accent:#ff5d3a; --accent2:#17b8ff; --green:#22c55e; --red:#f43f5e;
    --btn-ink:#ffffff;
    --shadow:0 10px 28px rgba(0,0,0,.35);
  }
  /* ---- Açık tema ---- */
  :root[data-theme="light"]{
    --bg:#f4f5f9; --panel:#ffffff; --panel2:#eef0f5; --border:#e1e4ec;
    --text:#181a20; --muted:#697083;
    --accent:#ff5d3a; --accent2:#0284c7; --green:#16a34a; --red:#e11d48;
    --btn-ink:#ffffff;
    --shadow:0 10px 24px rgba(20,20,40,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;transition:background .2s ease,color .2s ease;}
  #app{min-height:100vh;display:block;padding:0;}
  .box{max-width:380px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:30px;box-shadow:var(--shadow);}
  h1{font-size:22px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em;}
  p.muted{color:var(--muted);text-align:center;font-size:13.5px;margin:0 0 22px;line-height:1.5;}
  input,select{width:100%;background:var(--panel2);border:1.5px solid var(--border);color:var(--text);border-radius:12px;padding:12px 14px;font-size:14.5px;margin-bottom:10px;font-family:inherit;transition:border-color .15s ease, box-shadow .15s ease;}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,93,58,.18);}
  button{width:100%;padding:13px;border:none;border-radius:12px;background:var(--accent);color:var(--btn-ink);font-weight:700;font-size:14.5px;cursor:pointer;margin-top:6px;font-family:inherit;transition:filter .15s ease, transform .08s ease;box-shadow:0 3px 0 rgba(0,0,0,.18);}
  button:hover{filter:brightness(1.08);}
  button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
  button:disabled{opacity:.5;cursor:not-allowed;filter:none;transform:none;}
  .error{color:var(--red);font-size:13px;text-align:center;margin-top:10px;min-height:18px;font-weight:600;}
  .welcome{text-align:center;}
  .welcome .role{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:5px 14px;font-size:12.5px;color:var(--accent);margin-top:10px;font-weight:600;}
  .logout{background:transparent;border:1px solid var(--border);color:var(--muted);margin-top:20px;box-shadow:none;}

  /* ---- Uygulama kabuğu: sol kenar çubuğu + içerik ---- */
  .app-shell{display:flex;min-height:100vh;}
  .sidebar{width:230px;flex-shrink:0;background:var(--sb-bg);color:var(--sb-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;transition:width .18s ease;}
  .sidebar.collapsed{width:74px;}
  .sidebar .sb-top{display:flex;align-items:center;justify-content:space-between;padding:18px 14px 16px;border-bottom:1px solid var(--sb-border);}
  .sidebar .sb-brand{font-weight:800;font-size:15px;cursor:pointer;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;}
  .sb-collapse-btn{width:30px;height:30px;padding:0;margin:0;flex-shrink:0;border-radius:8px;background:rgba(255,255,255,.07);color:var(--sb-muted);box-shadow:none;font-size:14px;}
  .sb-collapse-btn:hover{background:rgba(255,255,255,.14);color:#fff;}
  .sidebar .sb-user{padding:14px 20px;border-bottom:1px solid var(--sb-border);white-space:nowrap;overflow:hidden;}
  .sidebar .sb-user .name{font-weight:700;font-size:13.5px;}
  .sidebar .sb-user .role{color:var(--sb-muted);font-size:11.5px;margin-top:2px;}
  .sidebar nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:4px;}
  .sb-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;color:var(--sb-muted);font-size:13.5px;font-weight:600;cursor:pointer;transition:all .15s ease;border-left:3px solid transparent;white-space:nowrap;overflow:hidden;}
  .sb-item .ic{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
  .sb-item:hover{background:rgba(255,255,255,.05);color:var(--sb-text);}
  .sb-item.active{background:var(--sb-active);color:#fff;border-left-color:var(--sb-accent);}
  .sidebar .sb-bottom{padding:14px 16px 18px;border-top:1px solid var(--sb-border);display:flex;flex-direction:column;gap:8px;}
  .theme-toggle{display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:3px;gap:2px;overflow:hidden;}
  .theme-toggle button{flex:1;margin:0;padding:7px 0;font-size:12px;background:transparent;color:var(--sb-muted);box-shadow:none;border-radius:999px;white-space:nowrap;}
  .theme-toggle button.active{background:var(--sb-accent);color:#fff;}
  .sb-logout{background:transparent;border:1px solid var(--sb-border);color:var(--sb-muted);box-shadow:none;font-size:13px;white-space:nowrap;overflow:hidden;}
  .sb-logout:hover{border-color:var(--sb-accent);color:#fff;}
  .sidebar.collapsed .label,.sidebar.collapsed .sb-user,.sidebar.collapsed .sb-brand-text{display:none;}
  .sidebar.collapsed .sb-top{justify-content:center;padding:18px 8px 16px;}
  .sidebar.collapsed .sb-item{justify-content:center;padding:11px 0;}
  .sidebar.collapsed .theme-toggle,.sidebar.collapsed .sb-logout span.label{display:none;}
  .sidebar.collapsed .sb-bottom{align-items:center;}
  .sidebar.collapsed .sb-logout{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:10px;}
  .content-area{flex:1;min-width:0;}
  .content-inner{max-width:1100px;margin:0 auto;padding:26px;width:100%;}
  @media (max-width:820px){
    .app-shell{flex-direction:column;}
    .sidebar,.sidebar.collapsed{width:100%;height:auto;position:sticky;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:visible;}
    .sidebar .sb-top,.sidebar .sb-user{display:none;}
    .sidebar nav{flex-direction:row;padding:8px;gap:6px;}
    .sidebar.collapsed .sb-item{justify-content:flex-start;padding:9px 12px;}
    .sidebar.collapsed .label{display:inline;}
    .sb-item{border-left:none;border-bottom:3px solid transparent;white-space:nowrap;padding:9px 12px;}
    .sb-item.active{border-left-color:transparent;border-bottom-color:var(--sb-accent);}
    .sidebar .sb-bottom{flex-direction:row;padding:8px 10px;border-top:none;border-left:1px solid var(--sb-border);}
    .sidebar.collapsed .theme-toggle{display:flex;}
    .theme-toggle{width:90px;}
  }

  header.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;box-shadow:0 2px 12px rgba(0,0,0,.08);}
  header.topbar .brand{font-weight:800;cursor:pointer;font-size:16px;letter-spacing:-.01em;}
  header.topbar .right{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap;}
  .role-badge{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--accent);font-weight:600;}
  main{display:block;width:100%;}
  .muted{color:var(--muted);}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:22px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;}
  .card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow);}
  .card .icon{font-size:28px;margin-bottom:8px;}
  .card h3{margin:0 0 4px;font-size:15.5px;font-weight:700;}
  .card p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.4;}
  .tabs{display:flex;gap:7px;flex-wrap:wrap;margin:16px 0;}
  .tab{padding:8px 15px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);cursor:pointer;font-size:13px;color:var(--muted);font-weight:600;transition:all .15s ease;}
  .tab:hover{border-color:var(--accent);color:var(--text);}
  .tab.active{background:var(--accent);color:var(--btn-ink);font-weight:700;border-color:var(--accent);}
  .table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;}
  .table-cell{border-radius:16px;padding:18px 10px;text-align:center;border:1.5px solid var(--border);background:var(--panel2);color:var(--muted);font-weight:700;transition:transform .12s ease;}
  .table-cell:hover{transform:translateY(-2px);}
  .ghost-btn{background:transparent;border:1.5px solid var(--border);color:var(--muted);width:auto;padding:9px 15px;margin:0;box-shadow:none;font-weight:600;}
  .ghost-btn:hover{border-color:var(--accent);color:var(--text);filter:none;}
  .center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}

  .settings-table-wrap{overflow-x:auto;}
  .settings-table{width:100%;min-width:640px;border-collapse:separate;border-spacing:0 10px;}
  .settings-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:0 10px 6px;font-weight:700;}
  .settings-table td{background:var(--panel2);padding:12px 10px;border-top:1.5px solid var(--border);border-bottom:1.5px solid var(--border);vertical-align:middle;}
  .settings-table td:first-child{border-left:1.5px solid var(--border);border-radius:12px 0 0 12px;}
  .settings-table td:last-child{border-right:1.5px solid var(--border);border-radius:0 12px 12px 0;white-space:nowrap;}
  .settings-table input,.settings-table select{margin:0;background:transparent;border:1.5px solid transparent;padding:8px;border-radius:8px;width:100%;}
  .settings-table input:hover,.settings-table select:hover{background:var(--panel);}
  .settings-table input:focus,.settings-table select:focus{background:var(--panel);border-color:var(--accent);}
  .settings-table .col-name{min-width:140px;}
  .settings-table .col-num{width:90px;}
  .settings-table .sbtn{width:auto;padding:9px 14px;margin:0 0 0 6px;font-size:13px;box-shadow:none;}
  .add-row-panel{background:var(--panel2);border:1.5px dashed var(--border);border-radius:14px;padding:16px;margin-top:16px;}
  .add-row-panel p{margin:0 0 12px;font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .field-group{display:flex;flex-direction:column;gap:4px;}
  .field-group label{font-size:11px;color:var(--muted);font-weight:600;}
  .field-group input,.field-group select{margin:0;}
  .icon-pick-btn{width:52px;height:52px;font-size:26px;border-radius:12px;border:1.5px solid var(--border);background:var(--panel2);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;margin:0;box-shadow:none;}
  .icon-pick-btn:hover{border-color:var(--accent);}
  .icon-picker-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  .icon-picker-item{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:24px;border-radius:12px;border:1.5px solid var(--border);background:var(--panel2);cursor:pointer;transition:transform .08s ease, border-color .15s ease;}
  .icon-picker-item:hover{transform:scale(1.08);}
  .icon-picker-item.selected{border-color:var(--accent);background:rgba(255,93,58,.15);}
  .prod-pick-card{transition:transform .06s ease, border-color .1s ease;-webkit-tap-highlight-color:transparent;}
  .prod-pick-card:active{transform:scale(.95);border-color:var(--accent);}
  .qty-btn{width:32px;height:32px;padding:0;margin:0;flex-shrink:0;border-radius:8px;background:var(--panel);border:1.5px solid var(--border);color:var(--text);font-weight:800;font-size:16px;box-shadow:none;}
  .qty-btn:active{transform:scale(.92);}

  /* ---- Mutfak fişi yazdırma (termal fiş kağıdına uygun) ---- */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      display:block;position:fixed;top:0;left:0;width:80mm;
      font-family:'Courier New',monospace;color:#000;padding:4mm;
    }
    #printArea.pw58{width:58mm;}
    @page{margin:0;size:80mm auto;}
  }
  .ticket-title{text-align:center;font-weight:800;font-size:15px;margin-bottom:2mm;text-transform:uppercase;}
  .ticket-meta{text-align:center;font-size:11px;margin-bottom:3mm;}
  .ticket-line{border-top:1px dashed #000;margin:2mm 0;}
  .ticket-item{display:flex;justify-content:space-between;font-size:13px;margin:1.5mm 0;}
  .ticket-item .qty{font-weight:800;margin-right:6px;}
  .ticket-time{font-size:11px;color:#555;white-space:nowrap;margin-left:8px;}
  .ticket-note{font-size:11px;font-style:italic;padding-left:20px;}
  .ticket-paper{background:#fff;color:#000;font-family:'Courier New',monospace;padding:14px;width:302px;box-shadow:0 2px 10px rgba(0,0,0,.15);}
  .ticket-paper.pw58{width:219px;}
  .kitchen-item-row{font-size:16px;}
  .kitchen-timer{font-size:18px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;}
  .kitchen-timer.kt-warn{color:#eab308;}
  .kitchen-timer.kt-danger{color:var(--red);}
</style>
<script>
  // Sayfa boyanmadan önce doğru temayı uygula (yanıp sönmeyi önler)
  (function(){
    try{
      var t = localStorage.getItem('rys_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  })();
</script>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<script>
/* ====== BURAYI KENDİ SUPABASE BİLGİLERİNİZLE DOLDURUN ====== */
const SUPABASE_URL = 'https://dveybagnrgofxkqangvo.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7gHhsaPYOzOddFnpjntPKw_S3Mgg3V8';
/* Aylık abonelik yenileme ödemesini başlatan uç nokta (Vercel /api).
   Kayıt sırasında artık ödeme yok (7 günlük ücretsiz deneme) - bu sadece
   Ayarlar'daki "Öde / Yenile" akışında, oturum token'ı ile kullanılıyor. */
const PAYMENT_RENEW_URL = '/api/payment-initialize';
/* ============================================================ */

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ROLE_LABELS = { waiter:'Garson', kitchen:'Mutfak', manager:'Yönetici' };
const PACKAGES = {
  paket1: {id:'paket1', name:'Paket 1 - Başlangıç', maxUsers:3, durationDays:14, desc:'1 Yönetici + 1 Mutfak + 1 Garson. 2 hafta.'},
  paket2: {id:'paket2', name:'Paket 2 - Standart', maxUsers:8, durationDays:60, desc:'8 kullanıcıya kadar. 2 ay.'},
  paket3: {id:'paket3', name:'Paket 3 - Profesyonel', maxUsers:20, durationDays:180, desc:'20 kullanıcıya kadar. 6 ay.'}
};

function getSession(){
  try{ return JSON.parse(sessionStorage.getItem('staff_session')||'null'); }
  catch(e){ return null; }
}
function setSession(s){ sessionStorage.setItem('staff_session', JSON.stringify(s)); }
function clearSession(){ sessionStorage.removeItem('staff_session'); }

function getAdminSession(){
  try{ return JSON.parse(sessionStorage.getItem('platform_admin_session')||'null'); }
  catch(e){ return null; }
}
function setAdminSession(s){ sessionStorage.setItem('platform_admin_session', JSON.stringify(s)); }
function clearAdminSession(){ sessionStorage.removeItem('platform_admin_session'); }
function isAdminMode(){
  return new URLSearchParams(window.location.search).get('admin')==='1' || !!getAdminSession();
}

const APP = { view:'home', config:null, selectedZone:null, draftCart:{}, liveOrders:[], authScreen:'login', selectedPackage:'paket1', pendingSignup:null, adminView:'promos', settingsTab:'stations' };

const NAV_ITEMS = [
  { view:'order', icon:'🍽️', label:'Sipariş Al', roles:['waiter','manager'] },
  { view:'kitchen', icon:'🧑‍🍳', label:'Mutfak Ekranı', roles:['kitchen','manager'] },
  { view:'printerSettings', icon:'🖨️', label:'Yazıcı Ayarları', roles:['kitchen','waiter','manager'] },
  { view:'notificationSettings', icon:'🔔', label:'Bildirim Ayarları', roles:['kitchen','waiter','manager'] },
  { view:'payments', icon:'💳', label:'Ödemeler', roles:['manager'] },
  { view:'reports', icon:'📊', label:'Finansal Analiz', roles:['manager'] },
  { view:'settings', icon:'⚙️', label:'Ayarlar', roles:['manager'] },
];
function getTheme(){ try{ return localStorage.getItem('rys_theme')||'dark'; }catch(e){ return 'dark'; } }
function setTheme(t){
  try{ localStorage.setItem('rys_theme', t); }catch(e){}
  document.documentElement.setAttribute('data-theme', t);
  if(getSession() || getAdminSession()) render();
}
function getSidebarCollapsed(){ try{ return localStorage.getItem('rys_sidebar')==='collapsed'; }catch(e){ return false; } }
function toggleSidebar(){
  const collapsed = !getSidebarCollapsed();
  try{ localStorage.setItem('rys_sidebar', collapsed?'collapsed':'open'); }catch(e){}
  render();
}

function render(){
  if(isAdminMode()){ renderAdminArea(); return; }

  const app = document.getElementById('app');
  const session = getSession();
  if(!session){
    if(APP.authScreen==='signup') renderSignupScreen(app);
    else renderLoginScreen(app);
    return;
  }

  const theme = getTheme();
  const collapsed = getSidebarCollapsed();
  const items = NAV_ITEMS.filter(i => i.roles.includes(session.role));
  app.innerHTML = `
    <div class="app-shell">
      <aside class="sidebar ${collapsed?'collapsed':''}">
        <div class="sb-top">
          <div class="sb-brand" onclick="goHome()"><span class="label">${escapeHtml(session.restaurant_name)}</span></div>
          <button class="sb-collapse-btn" onclick="toggleSidebar()" title="Menüyü daralt/genişlet">${collapsed?'»':'«'}</button>
        </div>
        <div class="sb-user">
          <div class="name">${escapeHtml(session.username)}</div>
          <div class="role">${ROLE_LABELS[session.role] || session.role}</div>
        </div>
        <nav>
          ${items.map(i => `<div class="sb-item ${APP.view===i.view?'active':''}" onclick="goToView('${i.view}')" title="${i.label}"><span class="ic">${i.icon}</span><span class="label">${i.label}</span></div>`).join('')}
        </nav>
        <div class="sb-bottom">
          <div class="theme-toggle">
            <button class="${theme==='dark'?'active':''}" onclick="setTheme('dark')" type="button">🌙 <span class="label">Koyu</span></button>
            <button class="${theme==='light'?'active':''}" onclick="setTheme('light')" type="button">☀️ <span class="label">Açık</span></button>
          </div>
          <button class="sb-logout" onclick="doLogout()" title="Çıkış Yap">🚪<span class="label"> Çıkış Yap</span></button>
        </div>
      </aside>
      <div class="content-area"><div class="content-inner"><main id="main"></main></div></div>
    </div>`;
  const main = document.getElementById('main');
  if(APP.view==='home') renderHome(main, session);
  else if(APP.view==='order') renderOrderView(main, session);
  else if(APP.view==='kitchen') renderKitchenView(main, session);
  else if(APP.view==='payments') renderPaymentsView(main, session);
  else if(APP.view==='settings') renderSettingsView(main, session);
  else if(APP.view==='reports') renderReportsView(main, session);
  else if(APP.view==='printerSettings') renderPrinterSettingsView(main, session);
  else if(APP.view==='notificationSettings') renderNotificationSettingsView(main, session);
}
function todayLocalDateStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function goToView(view){
  APP.view = view;
  // Finansal Analiz'e her girişte, en son baktiginiz tarihi hatirlamak yerine
  // dogrudan bugunun raporunu getirir - farkli bir tarihe bakmak isterseniz
  // ekrandaki tarih seciciden degistirebilirsiniz.
  if(view==='reports') APP.reportDate = todayLocalDateStr();
  // Mutfak ekranindan cikinca arka plandaki yenileme/sayac calismaya devam etmesin.
  if(view!=='kitchen') stopKitchenPolling();
  render();
}

/* ================= GİZLİ PLATFORM YÖNETİMİ (?admin=1) ================= */
function renderAdminArea(){
  const app = document.getElementById('app');
  const admin = getAdminSession();
  if(!admin){ renderAdminLogin(app); return; }
  const theme = getTheme();
  app.innerHTML = `
    <header class="topbar">
      <div class="brand">🔒 Platform Yönetimi</div>
      <div class="right">
        <div class="theme-toggle" style="width:150px;background:var(--panel2);border:1px solid var(--border);">
          <button class="${theme==='dark'?'active':''}" style="color:${theme==='dark'?'':'var(--muted)'};background:${theme==='dark'?'var(--accent)':'transparent'};box-shadow:none;" onclick="setTheme('dark')" type="button">🌙 Koyu</button>

  const maxRaw = document.getElementById('npMax').value.trim();

async function refreshKitchenItems(session){
  const { data, error } = await sb.rpc('get_live_orders', { p_token: session.session_token });
  const wrap = document.getElementById('kitchenWrap'); if(!wrap) return;
  if(error){ wrap.innerHTML = '<p class="muted">Yüklenemedi: '+error.message+'</p>'; return; }
  APP.liveOrders = data || [];
  const cards = [];
  APP.kitchenPendingByTable = {};
  const currentIds = new Set();
  APP.liveOrders.forEach(o => {
    // Sadece bu istasyona ait ve henuz hazirlanmamis urunler - her masanin bu
    // istasyona dusen urunleri tek bir kartta (masa bazinda) gruplanmis olarak gorunur.
    // station_id atanmamis (null) urunler hicbir ekranda kaybolmasin diye her istasyonda gosterilir.
    const pending = o.items.filter(i => i.status==='pending' && (i.station_id===APP.kitchenStation || i.station_id==null));
    if(pending.length===0) return;
    pending.forEach(it => currentIds.add(it.id));
    const tableName = tableNameForId(o.table_id);
    APP.kitchenPendingByTable[o.table_id] = { tableName, items: pending, dailyNumber: o.daily_number };
    cards.push(`<div style="background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b>${escapeHtml(tableName)}${o.daily_number?' <span class="muted" style="font-weight:400;font-size:12px;">#'+o.daily_number+'</span>':''}</b>
        <span style="cursor:pointer;color:var(--muted);font-size:16px;" onclick="reprintKitchenTicket('${o.table_id}')" title="Fişi tekrar yazdır">🖨️</span>
      </div>
      ${pending.map(it => `<div class="kitchen-item-row" style="padding:10px 0;border-top:1px dashed var(--border);">
        <div style="display:grid;grid-template-columns:1fr 64px auto;align-items:center;gap:10px;">
          <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${it.qty}x ${escapeHtml(it.name)}</span>
          <span class="kitchen-timer" data-added="${it.added_at||''}" data-id="${it.id}" data-name="${escapeHtml(tableName+' - '+it.qty+'x '+it.name)}" style="text-align:center;">-</span>
          <button style="width:auto;padding:8px 14px;font-size:14px;background:var(--green);color:var(--btn-ink);" onclick="markReady('${it.id}')">Hazır</button>
        </div>
        ${it.note?'<div class="muted" style="font-size:12px;font-style:italic;margin-top:4px;">Not: '+escapeHtml(it.note)+'</div>':''}
      </div>`).join('')}
      </div>`);
  });
  wrap.innerHTML = cards.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;">${cards.join('')}</div>` : '<p class="muted">Bekleyen sipariş yok.</p>';

  // Daha once gorulmemis (yeni gelen) urun varsa zil calsin. Ilk yuklemede calmamasi icin
  // kitchenSeenItemIds null iken sadece kayit tutulur, karsilastirma yapilmaz.
  if(APP.kitchenSeenItemIds){
    let hasNew = false;
    currentIds.forEach(id => { if(!APP.kitchenSeenItemIds.has(id)) hasNew = true; });
    if(hasNew) playKitchenBell(APP.kitchenStation);
  }
  APP.kitchenSeenItemIds = currentIds;
  updateKitchenTimers();
}
function tableNameForId(tableId){
  for(const z of APP.config.zones){ const t = z.tables.find(t=>t.id===tableId); if(t) return t.name; }
  return 'Masa';
}
async function pickKitchenStation(id){ primeKitchenAudio(); APP.kitchenStation=id; render(); }

/* ---- Mutfak: canli sayac + yeni siparis zili ---- */
function stopKitchenPolling(){
  if(APP.kitchenPollInterval){ clearInterval(APP.kitchenPollInterval); APP.kitchenPollInterval=null; }
  if(APP.kitchenTimerInterval){ clearInterval(APP.kitchenTimerInterval); APP.kitchenTimerInterval=null; }
}
function startKitchenPolling(session){
  stopKitchenPolling();
  // Yeni siparisleri yakalamak icin arka planda periyodik yenileme (websocket/canli
  // abonelik kurulmadigi icin en basit ve guvenilir yontem bu).
  APP.kitchenPollInterval = setInterval(() => {
    if(APP.view==='kitchen' && APP.kitchenStation) refreshKitchenItems(session);
  }, 8000);
  APP.kitchenTimerInterval = setInterval(updateKitchenTimers, 1000);
}
function updateKitchenTimers(){
  if(!APP.kitchenLateWarned) APP.kitchenLateWarned = new Set();
  document.querySelectorAll('.kitchen-timer[data-added]').forEach(el => {
    const added = el.dataset.added;
    if(!added){ el.textContent='-'; return; }
    const secs = Math.max(0, Math.floor((Date.now() - new Date(added).getTime())/1000));
    const mm = Math.floor(secs/60), ss = secs%60;
    el.textContent = mm + ':' + String(ss).padStart(2,'0');
    // 0-10 dk yesil (varsayilan), 10-15 dk sari, 15 dk+ kirmizi.
    el.classList.toggle('kt-warn', secs>=600 && secs<900);
    el.classList.toggle('kt-danger', secs>=900);
    // 15 dakikayi gectiginde, urun basina bir kez uyari mesaji goster.
    const itemId = el.dataset.id;
    if(secs>=900 && itemId && !APP.kitchenLateWarned.has(itemId)){
      APP.kitchenLateWarned.add(itemId);
      showToast('⏰ ' + (el.dataset.name||'Bir sipariş') + ' 15 dakikayı geçti!');
    }
  });
}
let KITCHEN_AUDIO_CTX = null;
/* Tarayicilar bir kullanici tiklamasi olmadan ses calmayi engeller; istasyon secimi
   gibi gercek bir tiklama aninda AudioContext'i "kilidini acmak" icin onceden calistirilir. */
function primeKitchenAudio(){
  try{
    KITCHEN_AUDIO_CTX = KITCHEN_AUDIO_CTX || new (window.AudioContext || window.webkitAudioContext)();
    if(KITCHEN_AUDIO_CTX.state==='suspended') KITCHEN_AUDIO_CTX.resume();
  }catch(e){}
  try{ const a = new Audio(); a.volume = 0; a.play().catch(()=>{}); }catch(e){}
}
function playKitchenBell(stationId){
  const customUrl = resolveBellSoundUrl(stationId);
  if(customUrl){
    try{
      const audio = new Audio(customUrl);
      audio.play().catch(e => console.warn('Zil sesi çalınamadı:', e));
      return;
    }catch(e){ console.warn('Zil sesi çalınamadı:', e); }
  }
  try{
    KITCHEN_AUDIO_CTX = KITCHEN_AUDIO_CTX || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = KITCHEN_AUDIO_CTX;
    if(ctx.state==='suspended') ctx.resume();
    [880, 1320].forEach((freq, i) => {
      const t0 = ctx.currentTime + i*0.18;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.3, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0+0.4);
    });
  }catch(e){ console.warn('Zil sesi çalınamadı:', e); }
}

async function openPaymentsView(){ APP.view='payments'; render(); }
async function renderPaymentsView(main, session){
  main.innerHTML = `<h1>Ödemeler</h1><p class="muted" id="payStatus">Yükleniyor...</p><div class="table-grid" id="payGrid"></div>`;
  const [cfgRes, liveRes] = await Promise.all([
    APP.config ? {data:APP.config} : sb.rpc('get_restaurant_config', { p_token: session.session_token }),
    sb.rpc('get_live_orders', { p_token: session.session_token })
  ]);
  if(!APP.config) APP.config = cfgRes.data;
  APP.liveOrders = liveRes.data || [];
  document.getElementById('payStatus').textContent = '';
  const allTables = APP.config.zones.flatMap(z => z.tables);
  const grid = document.getElementById('payGrid');
  const occupiedRows = allTables.map(t => {
    const order = liveOrderForTable(t.id);
    if(!order || order.items.length===0) return null;
    const total = order.items.reduce((s,i) => s+i.price*i.qty, 0);
    return `<div class="table-cell" style="cursor:pointer;background:rgba(244,63,94,.14);border-color:var(--red);color:var(--red);" onclick="openPayModal('${order.order_id}','${t.id}','${escapeHtml(t.name)}')">
      ${escapeHtml(t.name)}<div style="font-size:11px;margin-top:4px;font-weight:400;">${money(total)}</div></div>`;
  }).filter(Boolean);
  grid.innerHTML = occupiedRows.length ? occupiedRows.join('') : '<p class="muted">Açık hesap yok.</p>';
}

      <div style="display:flex;gap:8px;">
        <input id="discValue" type="number" min="0" step="0.01" placeholder="0" style="flex:1;margin:0;">

        </select>

function applyPayDiscount(){
  const bg = document.getElementById('payModalBg');
  const subtotal = parseFloat(bg.dataset.subtotal);
  const type = document.getElementById('discType').value;
  let val = parseFloat(document.getElementById('discValue').value)||0;
  if(val<0) val=0;
  let discAmount = type==='percent' ? subtotal*val/100 : val;
  if(discAmount>subtotal) discAmount = subtotal;
  bg.dataset.discountAmount = String(discAmount);
  bg.dataset.discountType = type;
  bg.dataset.discountValue = String(val);
  const final = subtotal - discAmount;
  document.getElementById('discInfo').textContent = discAmount>0 ? ('İndirim: -'+money(discAmount)+(type==='percent'?' (%'+val+')':'')) : 'İndirim yok';
  document.getElementById('payFinalTotal').textContent = 'Ödenecek: '+money(final);
}
function payFinalTotal(){
  const bg = document.getElementById('payModalBg');
  return parseFloat(bg.dataset.subtotal) - parseFloat(bg.dataset.discountAmount||0);
}
async function finishPaymentFull(method){
  const bg = document.getElementById('payModalBg');
  const orderId = bg.dataset.orderId;
  const total = Math.round(payFinalTotal()*100)/100;
  await finishPayment(orderId, method, total, method==='cash'?total:0, method==='card'?total:0, parseFloat(bg.dataset.discountAmount||0));
}

function calcSplitPay(total){
  const tp = parseFloat(document.getElementById('splitPeople').value)||0;
  const cp = parseFloat(document.getElementById('splitCashPeople').value);
  if(tp<=0 || isNaN(cp) || cp<0 || cp>tp){ alert('Geçerli kişi sayıları girin'); return; }
  const cash = Math.round((total*cp/tp)*100)/100;
  document.getElementById('splitCash').value = cash;
  updateSplitPayPreview(total);
  const cardPeople = Math.round(tp-cp);
  if(cardPeople>0){ document.getElementById('cardChargeCount').value = cardPeople; genCardCharges(total); }
  if(cp>0){ document.getElementById('cashChargeCount').value = cp; genCashCharges(total); }
}
function updateSplitPayPreview(total){
  let cash = parseFloat(document.getElementById('splitCash').value)||0;
  if(cash<0) cash=0; if(cash>total) cash=total;
  document.getElementById('splitCardPreview').textContent = 'Kredi Kartı: '+money(total-cash);
  const cashBox = document.getElementById('cashChargesBox'); if(cashBox) cashBox.innerHTML = '';
  const cardBox = document.getElementById('cardChargesBox'); if(cardBox) cardBox.innerHTML = '';
}
function genCashCharges(total){
  let cash = parseFloat(document.getElementById('splitCash').value)||0;
  if(cash<0) cash=0; if(cash>total) cash=total;
  if(cash<=0){ alert('Bölünecek nakit tutar yok'); return; }
  const count = Math.max(1, parseInt(document.getElementById('cashChargeCount').value)||1);
  const base = Math.floor((cash/count)*100)/100;
  const charges = [];
  let sum=0;
  for(let i=0;i<count-1;i++){ charges.push(base); sum+=base; }
  charges.push(Math.round((cash-sum)*100)/100);
  document.getElementById('cashChargesBox').innerHTML = charges.map((c,i) =>
    `<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;"><span class="muted" style="width:50px;font-size:12px;">Nakit ${i+1}:</span><input class="cash-input" type="number" step="0.01" value="${c}" style="margin:0;" oninput="updateCashSum()"></div>`
  ).join('') + `<p id="cashSumInfo" class="muted" style="font-size:12px;margin-top:6px;"></p>`;
  updateCashSum(cash);
}
function updateCashSum(needed){
  const inputs = document.querySelectorAll('.cash-input');
  let sum=0; inputs.forEach(i => sum += parseFloat(i.value)||0);
  const info = document.getElementById('cashSumInfo'); if(!info) return;
  info.textContent = 'Nakit toplamı: '+money(sum)+(needed!=null?' / gerekli: '+money(needed):'');
}
function genCardCharges(total){
  const cash = parseFloat(document.getElementById('splitCash').value)||0;
  const cardTotal = Math.round((total-cash)*100)/100;
  if(cardTotal<=0){ alert('Bölünecek kredi kartı tutarı yok'); return; }
  const count = Math.max(1, parseInt(document.getElementById('cardChargeCount').value)||1);
  const base = Math.floor((cardTotal/count)*100)/100;
  const charges = [];
  let sum=0;
  for(let i=0;i<count-1;i++){ charges.push(base); sum+=base; }
  charges.push(Math.round((cardTotal-sum)*100)/100);
  document.getElementById('cardChargesBox').innerHTML = charges.map((c,i) =>
    `<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;"><span class="muted" style="width:50px;font-size:12px;">Kart ${i+1}:</span><input class="cc-input" type="number" step="0.01" value="${c}" style="margin:0;" oninput="updateCcSum()"></div>`
  ).join('') + `<p id="ccSumInfo" class="muted" style="font-size:12px;margin-top:6px;"></p>`;
  updateCcSum(cardTotal);
}
function updateCcSum(needed){
  const inputs = document.querySelectorAll('.cc-input');
  let sum=0; inputs.forEach(i => sum += parseFloat(i.value)||0);
  const info = document.getElementById('ccSumInfo'); if(!info) return;
  info.textContent = 'Çekimler toplamı: '+money(sum)+(needed!=null?' / gerekli: '+money(needed):'');
}
async function confirmSplitPay(orderId, total, discountAmount){
  let cash = parseFloat(document.getElementById('splitCash').value)||0;
  if(cash<0) cash=0; if(cash>total) cash=total;
  const card = Math.round((total-cash)*100)/100;
  document.getElementById('splitPayBg').remove();
  await finishPayment(orderId, 'split', total, cash, card, discountAmount);
}
async function finishPayment(orderId, method, total, cash, card, discountAmount){
  const session = getSession();
  const { error } = await sb.rpc('close_bill', {
    p_token: session.session_token, p_order_id: orderId, p_payment_method: method,
    p_cash: cash, p_card: card, p_discount_amount: discountAmount||0
  });
  if(error){ alert('Ödeme kaydedilemedi: '+error.message); return; }
  const bg = document.getElementById('payModalBg'); if(bg) bg.remove();
  renderPaymentsView(document.getElementById('main'), session);
}

async function renderOrderView(main, session){
  main.innerHTML = `<h1>Sipariş Al</h1><p class="muted" id="orderStatus">Yükleniyor...</p><div class="tabs" id="zoneTabs"></div><div class="table-grid" id="tableGrid"></div>`;

    sb.rpc('get_restaurant_config', { p_token: session.session_token }),
    sb.rpc('get_live_orders', { p_token: session.session_token })
  ]);
  const statusEl = document.getElementById('orderStatus');
  if(cfgRes.error || liveRes.error){
    statusEl.textContent = 'Veri yüklenemedi: ' + ((cfgRes.error||liveRes.error).message);
    statusEl.style.color = 'var(--red)';
    return;
  }
  APP.config = cfgRes.data;
  APP.liveOrders = liveRes.data || [];
  statusEl.textContent = '';
  if(!APP.config.zones || APP.config.zones.length===0){
    document.getElementById('tableGrid').innerHTML = '<p class="muted">Henüz bölge/masa eklenmemiş.</p>';
    return;
  }
  APP.selectedZone = APP.selectedZone || APP.config.zones[0].id;
  renderZoneTabs();
  renderTableGrid();
}
function renderZoneTabs(){
  const el = document.getElementById('zoneTabs'); if(!el) return;
  el.innerHTML = APP.config.zones.map(z =>
    `<div class="tab ${z.id===APP.selectedZone?'active':''}" onclick="selectZone('${z.id}')">${escapeHtml(z.name)}</div>`
  ).join('');
}
function selectZone(id){ APP.selectedZone = id; renderZoneTabs(); renderTableGrid(); }
function liveOrderForTable(tableId){
  return (APP.liveOrders||[]).find(o => o.table_id===tableId);
}
function renderTableGrid(){
  const el = document.getElementById('tableGrid'); if(!el) return;
  const zone = APP.config.zones.find(z => z.id===APP.selectedZone);
  if(!zone || zone.tables.length===0){ el.innerHTML = '<p class="muted">Bu bölgede masa yok.</p>'; return; }
  el.innerHTML = zone.tables.map(t => {
    const order = liveOrderForTable(t.id);
    const draft = (APP.draftCart && APP.draftCart[t.id]) || [];
    let sub = 'Boş';
    let occupied = false;
    if(order && order.items.length>0){
      occupied = true;
      const allReady = order.items.every(i => i.status==='ready');
      sub = order.items.length + ' ürün - ' + (allReady?'Hazır':'hazırlanıyor');
    }
    if(draft.length>0){ sub += (occupied?' + ':'') + draft.length+' üründe sepette'; occupied = true; }
    return `<div class="table-cell" style="${occupied?'background:rgba(244,63,94,.14);border-color:var(--red);color:var(--red);':''}" onclick="openTableModal('${t.id}','${escapeHtml(t.name)}')">
      ${escapeHtml(t.name)}<div style="font-size:11px;margin-top:4px;font-weight:400;">${sub}</div></div>`;
  }).join('');
}

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">

async function closeTableModal(){
  const bgEl = document.getElementById('tableModalBg');
  const tableId = bgEl ? bgEl.dataset.tableId : null;
  if(bgEl) bgEl.remove();
  if(tableId) await releaseDraftStock(tableId);
  renderTableGrid();
}
/* Masa penceresi onaysız kapatılırsa, sepette kalan her şeyin stoğunu geri ekler. */
async function releaseDraftStock(tableId){
  const draft = APP.draftCart[tableId];
  if(!draft || draft.length===0) return;
  const session = getSession();
  const items = draft.slice();
  // Sepet ve stok göstergeleri anında (iyimser) güncellenir; sunucuya stok geri
  // ekleme istekleri paralel ve arka planda gider, işlemi bekletmez.
  APP.draftCart[tableId] = [];
  items.forEach(item => applyLocalStockDelta(item.product_id, -item.qty));
  Promise.all(items.map(item =>
    sb.rpc('adjust_stock', { p_token: session.session_token, p_product_id: item.product_id, p_delta: item.qty })
  )).then(results => {
    if(results.some(r => r.error)) console.error('Bazı stoklar geri eklenemedi, sunucu ile senkronize ediliyor.');
    scheduleConfigResync(tableId);
  }).catch(e => console.error(e));
}
function pickStationTab(stId){
  document.querySelectorAll('#prodStationTabs .tab').forEach(t => t.classList.toggle('active', t.dataset.st===stId));
  const tableId = document.getElementById('tableModalBg').dataset.tableId;
  renderProductPick(stId, tableId);
}
function effectiveStock(p){
  if(p.recipe && p.recipe.length>0) return p.available_qty;
  return p.stock;
}
function renderProductPick(stationId, tableId){
  const el = document.getElementById('prodPick'); if(!el) return;
  const prods = APP.config.products.filter(p => p.station_id===stationId);
  el.innerHTML = prods.length ? prods.map(p => {
    const stock = effectiveStock(p);
    const off = p.available===false || (stock!=null && stock<=0);
    let badge = '';
    if(p.available===false) badge = '<div style="margin-top:4px;font-size:11px;color:var(--red);">Satışta Değil</div>';
    else if(stock!=null && stock<=0) badge = '<div style="margin-top:4px;font-size:11px;color:var(--red);">Stok Yok</div>';
    else if(stock!=null && stock<=10) badge = '<div style="margin-top:4px;font-size:11px;color:var(--accent);">Son '+stock+' porsiyon</div>';
    return `
    <div class="prod-pick-card" style="background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px 10px;font-size:13.5px;${off?'opacity:.4;cursor:not-allowed;':'cursor:pointer;'}" ${off?'':`onclick="addToDraft('${tableId}','${p.id}')"`}>
      <div style="font-weight:700;">${escapeHtml(p.name)}</div><div class="muted" style="font-size:12px;">${money(p.price)}</div>${badge}
    </div>`;
  }).join('') : '<p class="muted">Bu istasyonda ürün yok.</p>';
}
async function refreshConfigKeepDraft(session){
  const { data } = await sb.rpc('get_restaurant_config', { p_token: session.session_token });

/* Sunucudaki get_restaurant_config'in stok hesabını (floor(min(hammadde stok/oran))) client tarafında
   birebir tekrar üretir, böylece her tıklamada tam config'i yeniden çekmeye gerek kalmaz. */
function applyLocalStockDelta(productId, delta){
  const prod = APP.config.products.find(p => p.id===productId);
  if(!prod) return;
  if(prod.recipe && prod.recipe.length>0){
    const touchedIngredientIds = new Set();
    prod.recipe.forEach(r => {
      const ing = APP.config.ingredients.find(i => i.id===r.ingredient_id);
      if(ing){ ing.stock -= r.qty_per_unit*delta; touchedIngredientIds.add(ing.id); }
    });
    APP.config.products.forEach(p => {
      if(!p.recipe || !p.recipe.some(r => touchedIngredientIds.has(r.ingredient_id))) return;
      let minQty = null;
      p.recipe.forEach(r => {
        if(r.qty_per_unit<=0) return;
        const ing = APP.config.ingredients.find(i => i.id===r.ingredient_id);
        if(!ing) return;
        const q = Math.floor(ing.stock / r.qty_per_unit);
        if(minQty===null || q<minQty) minQty = q;
      });
      p.available_qty = minQty;
    });
  } else if(prod.stock!=null){
    prod.stock -= delta;
  }
}
let _configResyncTimer = null;
function scheduleConfigResync(tableId){
  clearTimeout(_configResyncTimer);
  _configResyncTimer = setTimeout(async () => {
    const session = getSession();
    if(!session) return;
    await refreshConfigKeepDraft(session);
    const bg = document.getElementById('tableModalBg');
    if(bg && bg.dataset.tableId===tableId){
      const activeTab = document.querySelector('#prodStationTabs .tab.active');
      if(activeTab) renderProductPick(activeTab.dataset.st, tableId);
    }
  }, 1500);
}
function addToDraft(tableId, productId){
  const prod = APP.config.products.find(p => p.id===productId);
  if(!prod) return;
  if(prod.available===false){ alert('Bu ürün şu anda satışta değil'); return; }
  const stock = effectiveStock(prod);
  if(stock!=null && stock<=0){ alert('Bu üründe stok kalmadı'); return; }
  const draft = APP.draftCart[tableId];
  const existing = draft.find(i => i.product_id===productId);
  if(existing){ existing.qty += 1; }
  else{ draft.push({ product_id:productId, name:prod.name, price:prod.price, cost:prod.cost, station_id:prod.station_id, qty:1, note:'' }); }
  applyLocalStockDelta(productId, 1);
  renderTableItems(tableId);
  const activeTab = document.querySelector('#prodStationTabs .tab.active');
  if(activeTab) renderProductPick(activeTab.dataset.st, tableId);
  // Sepete ekleme ekranda anında görünür; stok düşümü arka planda sunucuya gönderilir.
  const session = getSession();
  sb.rpc('adjust_stock', { p_token: session.session_token, p_product_id: productId, p_delta: -1 }).then(({error}) => {
    if(!error){ scheduleConfigResync(tableId); return; }
    alert('Ürün eklenemedi, sepetten çıkarıldı: '+error.message);
    const d = APP.draftCart[tableId];
    const it = d.find(i => i.product_id===productId);
    if(it){ it.qty -= 1; if(it.qty<=0) d.splice(d.indexOf(it),1); }
    applyLocalStockDelta(productId, -1);
    renderTableItems(tableId);
    const t = document.querySelector('#prodStationTabs .tab.active');
    if(t) renderProductPick(t.dataset.st, tableId);
  });
}
async function changeDraftQty(tableId, idx, delta){
  const draft = APP.draftCart[tableId];
  if(!draft[idx]) return;
  const item = draft[idx];
  const productId = item.product_id;
  item.qty += delta;
  if(item.qty<=0) draft.splice(idx,1);
  applyLocalStockDelta(productId, delta);
  renderTableItems(tableId);
  const activeTab = document.querySelector('#prodStationTabs .tab.active');
  if(activeTab) renderProductPick(activeTab.dataset.st, tableId);
  const session = getSession();
  const { error } = await sb.rpc('adjust_stock', { p_token: session.session_token, p_product_id: productId, p_delta: -delta });
  if(error){
    alert(error.message);
    const d = APP.draftCart[tableId];
    const existing = d.find(i => i.product_id===productId);
    if(existing){ existing.qty -= delta; if(existing.qty<=0) d.splice(d.indexOf(existing),1); }
    else if(delta<0){ d.push({ ...item, qty:-delta }); }
    applyLocalStockDelta(productId, -delta);
    renderTableItems(tableId);
    const t = document.querySelector('#prodStationTabs .tab.active');
    if(t) renderProductPick(t.dataset.st, tableId);
    return;
  }
  scheduleConfigResync(tableId);
}

async function confirmOrder(tableId){
  const draft = APP.draftCart[tableId];
  if(!draft || draft.length===0) return;
  const btn = document.getElementById('confirmBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Gönderiliyor...'; }
  const session = getSession();
  const items = draft.map(d => ({ product_id:d.product_id, name:d.name, price:d.price, cost:d.cost, station_id:d.station_id, qty:d.qty, note:d.note||'' }));
  const { data: sendData, error } = await sb.rpc('send_order', { p_token: session.session_token, p_table_id: tableId, p_items: items });
  if(error){
    alert('Sipariş gönderilemedi: ' + error.message);
    if(btn){ btn.disabled = false; btn.textContent = '✅ Siparişi Onayla ve Mutfağa Gönder'; }
    return;
  }
  APP.draftCart[tableId] = [];
  const dailyNumber = sendData && sendData[0] ? sendData[0].daily_number : null;
  const nowIso = new Date().toISOString();
  const itemsForTicket = items.map(it => ({ ...it, added_at: nowIso }));
  printKitchenTicketGrouped(tableNameForId(tableId), itemsForTicket, true, dailyNumber);

    sb.rpc('get_live_orders', { p_token: session.session_token }),
    sb.rpc('get_restaurant_config', { p_token: session.session_token })
  ]);
  APP.liveOrders = liveRes.data || [];
  if(cfgRes.data) APP.config = cfgRes.data;
  await closeTableModal();
}

function currentBellScope(){ const el = document.getElementById('bellScopeSelect'); return el ? el.value : ''; }
function updateBellScopeStatus(){
  const statusEl = document.getElementById('bellScopeStatus'); if(!statusEl) return;
  const scope = currentBellScope();
  const sounds = getKitchenBellSounds();
  const has = scope ? !!sounds.perStation[scope] : !!sounds.default;
  statusEl.textContent = has ? '✓ Bu kapsam için özel ses yüklü.' : 'Bu kapsam için özel ses yok, varsayılan zil sesi çalınacak.';
}
function uploadBellSound(){
  const input = document.getElementById('bellFileInput');
  const file = input.files[0];
  if(!file) return;
  if(file.size > 800*1024){ alert('Ses dosyası çok büyük (maks. 800KB). Daha kısa/küçük bir dosya seçin.'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = () => {
    const sounds = getKitchenBellSounds();
    const scope = currentBellScope();
    if(!sounds.perStation) sounds.perStation = {};
    if(scope) sounds.perStation[scope] = reader.result;
    else sounds.default = reader.result;
    setKitchenBellSounds(sounds);
    updateBellScopeStatus();
    input.value = '';
    showToast('Kaydedildi ✓');
  };
  reader.readAsDataURL(file);
}
function resetBellSound(){
  const scope = currentBellScope();
  const sounds = getKitchenBellSounds();
  if(scope){ if(sounds.perStation) delete sounds.perStation[scope]; }
  else sounds.default = null;
  setKitchenBellSounds(sounds);
  updateBellScopeStatus();
}

      alert('USB yazıcı seçilmedi/eşleştirilemedi: ' + e.message);

    }

/* ---- ESC/POS ham komut olusturma (WebUSB dogrudan yazdirma icin) ---- */
function escposEncodeText(text){
  // Basit yaklasim: UTF-8 byte'lari gonderiyoruz. Turkce ozel karakterler
  // (ç,ğ,ı,ö,ş,ü) bazi yazici modellerinde/kod sayfalarinda hatali cikabilir -
  // yaziciniz farkli bir kod sayfasi gerektiriyorsa bildirin, ona gore ayarlarim.
  return new TextEncoder().encode(text);
}
function buildEscPosTicket(restaurantName, tableName, items, design, dailyNumber){
  const chunks = [];
  const push = (arr) => chunks.push(arr instanceof Uint8Array ? arr : new Uint8Array(arr));
  const lineWidth = design.width==='58' ? 32 : 48;
  push([0x1B, 0x40]); // init
  push([0x1B, 0x61, 0x01]); // center
  push([0x1B, 0x45, 0x01]); // bold on
  push(escposEncodeText((restaurantName||'').toUpperCase() + '\n'));
  push([0x1B, 0x45, 0x00]); // bold off
  if(design.header) push(escposEncodeText(design.header + '\n'));
  const now = new Date();
  push(escposEncodeText((dailyNumber ? ('Sipariş No: '+dailyNumber+' · ') : '') + tableName + '\n'));
  push(escposEncodeText(now.toLocaleDateString('tr-TR') + '\n'));
  push([0x1B, 0x61, 0x00]); // left align
  push(escposEncodeText('-'.repeat(lineWidth) + '\n'));
  items.forEach(it => {
    const timeStr = formatItemTime(it);
    const left = it.qty + 'x ' + it.name;
    const pad = Math.max(1, lineWidth - left.length - timeStr.length);
    push(escposEncodeText(left + ' '.repeat(pad) + timeStr + '\n'));
    if(it.note) push(escposEncodeText('  Not: ' + it.note + '\n'));
  });
  push(escposEncodeText('-'.repeat(lineWidth) + '\n'));
  if(design.footer){
    push([0x1B, 0x61, 0x01]);
    push(escposEncodeText(design.footer + '\n'));
  }
  push(escposEncodeText('\n\n\n'));
  push([0x1D, 0x56, 0x42, 0x00]); // kagit kes
  let total = 0; chunks.forEach(c => total += c.length);
  const out = new Uint8Array(total);
  let off = 0; chunks.forEach(c => { out.set(c, off); off += c.length; });
  return out;
}
async function sendToUsbPrinter(printer, bytes){
  if(!navigator.usb || !printer.usbInfo) return false;
  try{
    const devices = await navigator.usb.getDevices();
    const device = devices.find(d => d.vendorId===printer.usbInfo.vendorId && d.productId===printer.usbInfo.productId);
    if(!device) return false; // henuz izin verilmemis / bagli degil - tarayici penceresine dus
    await device.open();
    if(device.configuration === null) await device.selectConfiguration(1);
    const iface = device.configuration.interfaces[0];
    await device.claimInterface(iface.interfaceNumber);
    const endpoint = iface.alternate.endpoints.find(e => e.direction==='out');
    if(!endpoint) { await device.close(); return false; }
    await device.transferOut(endpoint.endpointNumber, bytes);
    await device.close();
    return true;
  }catch(e){
    console.error('USB yazdirma basarisiz:', e);
    return false;
  }
}

   yazıcıya (atanmamışsa "Bu Ekranın Yazıcısı"na) ayrı ayrı gönderir. */
async function printKitchenTicketGrouped(tableName, items, silent, dailyNumber){
  const groups = {};
  items.forEach(it => {
    const key = it.station_id || '';
    if(!groups[key]) groups[key] = [];
    groups[key].push(it);
  });
  for(const key of Object.keys(groups)){
    const printer = resolvePrinterForStation(key || null);
    await printKitchenTicket(tableName, groups[key], printer, silent, dailyNumber);
  }
}
async function printKitchenTicket(tableName, items, printerOverride, silent, dailyNumber){
  const session = getSession();
  const restaurantName = session ? session.restaurant_name : '';
  const design = getTicketDesign();
  const printers = getPrinters();
  const printer = printerOverride || printers.find(p => p.id===getActivePrinterId());

  if(printer && printer.type==='usb'){
    const bytes = buildEscPosTicket(restaurantName, tableName, items, design, dailyNumber);
    const ok = await sendToUsbPrinter(printer, bytes);
    if(ok) return; // basarili - tarayici penceresi ACILMADI
    console.warn('USB yaziciya ulasilamadi.');
  }

  // silent=true (siparis onaylaninca otomatik cagri): yazici yoksa/basarisizsa
  // ASLA tarayici penceresi acilmaz, sessizce vazgecilir. Sadece manuel
  // "yeniden yazdir" / "test yazdir" gibi bilincli tiklamalarda pencereye dusulur.
  if(silent) return;

  const el = document.getElementById('printArea');
  el.className = design.width==='58' ? 'pw58' : '';
  el.innerHTML = buildTicketHtml(restaurantName, tableName, items, design, dailyNumber);
  setTimeout(() => window.print(), 100);
}

async function doLogin(){

  const username = document.getElementById('userInput').value.trim();
  const password = document.getElementById('passInput').value;
  const errBox = document.getElementById('errBox');
  const btn = document.getElementById('loginBtn');
  errBox.textContent = '';

    errBox.textContent = 'Tüm alanları doldurun';
    return;
  }
  btn.disabled = true; btn.textContent = 'Giriş yapılıyor...';
  try{
    const { data, error } = await sb.rpc('login_staff', {
      p_code: code, p_username: username, p_password: password
    });
    if(error){
      console.error(error);
      errBox.textContent = 'Bağlantı hatası: ' + error.message;
      return;
    }
    if(!data || data.length === 0){
      errBox.textContent = 'İşletme kodu, kullanıcı adı veya şifre hatalı';
      return;
    }
    const row = data[0];

      user_id: row.user_id,
      restaurant_id: row.restaurant_id,
      role: row.role,
      restaurant_name: row.restaurant_name,

    });

    console.error(err);

function removeNewProductRecipeItem(idx){ NEW_PRODUCT_RECIPE_DRAFT.splice(idx,1); renderNewProductRecipeItems(); }
async function saveProduct(id){
  const session = getSession();
  const prod = APP.config.products.find(p => p.id===id);
  const name = document.getElementById('pr_name_'+id).value.trim();
  const stationId = document.getElementById('pr_st_'+id).value;
  const price = parseFloat(document.getElementById('pr_price_'+id).value)||0;
  const cost = parseFloat(document.getElementById('pr_cost_'+id).value)||0;
  const stockEl = document.getElementById('pr_stock_'+id);
  let stock = prod.stock;
  if(stockEl){ const raw = stockEl.value.trim(); stock = raw==='' ? null : parseInt(raw,10); }
  const { error } = await sb.rpc('upsert_product', { p_token: session.session_token, p_id: id, p_station_id: stationId, p_name: name, p_price: price, p_cost: cost, p_stock: stock, p_available: prod.available!==false });
  if(error){ alert(error.message); return; }
  renderSettingsView(document.getElementById('main'), session);
  showToast('Kaydedildi ✓');
}
async function toggleProductAvailable(id){
  const session = getSession();
  const prod = APP.config.products.find(p => p.id===id);
  const newAvailable = prod.available===false ? true : false;
  const { error } = await sb.rpc('upsert_product', { p_token: session.session_token, p_id: id, p_station_id: prod.station_id, p_name: prod.name, p_price: prod.price, p_cost: prod.cost, p_stock: prod.stock, p_available: newAvailable });
  if(error){ alert(error.message); return; }
  prod.available = newAvailable;
  renderSettingsView(document.getElementById('main'), session);
}
async function addProduct(){
  const session = getSession();
  const name = document.getElementById('np_name').value.trim();
  const stationId = document.getElementById('np_station').value;
  const price = parseFloat(document.getElementById('np_price').value)||0;
  const cost = parseFloat(document.getElementById('np_cost').value)||0;
  const stockRaw = document.getElementById('np_stock').value.trim();
  const stock = stockRaw==='' ? null : parseInt(stockRaw,10);
  if(!name) return;
  const { data: newId, error } = await sb.rpc('upsert_product', { p_token: session.session_token, p_id: null, p_station_id: stationId, p_name: name, p_price: price, p_cost: cost, p_stock: stock, p_available: true });
  if(error){ alert(error.message); return; }
  if(newId && NEW_PRODUCT_RECIPE_DRAFT.length>0){
    const items = NEW_PRODUCT_RECIPE_DRAFT.map(r => ({ ingredient_id: r.ingredient_id, qty_per_unit: r.qty_per_unit }));
    const { error: recError } = await sb.rpc('set_recipe', { p_token: session.session_token, p_product_id: newId, p_items: items });
    if(recError){ alert('Ürün eklendi ama reçete kaydedilemedi: ' + recError.message); }
  }
  NEW_PRODUCT_RECIPE_DRAFT = [];
  renderSettingsView(document.getElementById('main'), session);
}
async function removeProduct(id){
  if(!confirm('Ürünü silmek istediğinize emin misiniz?')) return;
  const session = getSession();
  const { error } = await sb.rpc('delete_product', { p_token: session.session_token, p_id: id });
  if(error){ alert(friendlyDeleteError(error.message)); return; }
  renderSettingsView(document.getElementById('main'), session);
}

/* --- Kullanıcılar --- */
function renderUsersSettings(el, session){
  const lic = APP.config.license;
  el.innerHTML = `<div class="box" style="max-width:none;">
    ${lic ? renderSubscriptionPanel(lic) : ''}
    <h2>Kullanıcılar</h2>
    <div class="settings-table-wrap">
    <table class="settings-table">
      <thead><tr><th>Kullanıcı Adı</th><th>Yeni Şifre</th><th>Rol</th><th></th></tr></thead>
      <tbody>
      ${APP.config.users.map(u => `
        <tr>
          <td class="col-name"><input value="${escapeHtml(u.username)}" id="us_name_${u.id}"></td>
          <td class="col-name"><input type="password" placeholder="(değiştirmek için yaz)" id="us_pass_${u.id}"></td>
          <td class="col-name"><select id="us_role_${u.id}">
            <option value="waiter" ${u.role==='waiter'?'selected':''}>Garson</option>
            <option value="kitchen" ${u.role==='kitchen'?'selected':''}>Mutfak</option>
            <option value="manager" ${u.role==='manager'?'selected':''}>Yönetici</option>
          </select></td>
          <td>
            <button class="sbtn" onclick="saveUser('${u.id}')">Kaydet</button>
            <button class="sbtn" style="background:var(--red);color:var(--btn-ink);" onclick="removeUser('${u.id}')">Sil</button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
    </div>
    <div class="add-row-panel">
      <p>Yeni Kullanıcı Ekle</p>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;">
        <div class="field-group"><label>Kullanıcı Adı</label><input id="nu_name" placeholder="örn. ahmet"></div>
        <div class="field-group"><label>Şifre</label><input id="nu_pass" placeholder="Şifre"></div>
        <div class="field-group"><label>Rol</label><select id="nu_role"><option value="waiter">Garson</option><option value="kitchen">Mutfak</option><option value="manager">Yönetici</option></select></div>
      </div>
      <button style="margin-top:12px;max-width:220px;" onclick="addUser()">+ Kullanıcı Ekle</button>
    </div>
  </div>`;
}
/* ---- Abonelik / Aylık Ödeme (Ayarlar > Kullanıcılar üstünde) ---- */
function renderSubscriptionPanel(lic){
  const expires = new Date(lic.expires_at);
  const daysLeft = Math.ceil((expires - new Date()) / (24*60*60*1000));
  const expired = daysLeft <= 0;
  const soon = !expired && daysLeft <= 3;
  const color = expired ? 'var(--red)' : (soon ? 'var(--accent)' : 'var(--green)');
  const statusText = expired
    ? 'Süreniz doldu — devam etmek için ödeme yapın.'
    : (daysLeft + ' gün kaldı (bitiş: ' + expires.toLocaleDateString('tr-TR') + ')');
  return `
    <div class="add-row-panel" style="border-color:${color};margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div>
          <div class="role-badge" style="margin-bottom:6px;">${escapeHtml(lic.package_id)} · ${APP.config.users.length}/${lic.max_users} kullanıcı</div>
          <div style="color:${color};font-weight:700;font-size:13.5px;">${statusText}</div>
        </div>
        <button id="renewBtn" style="width:auto;padding:10px 18px;margin:0;background:${color};" onclick="startRenewal()">💳 Öde / Yenile (Aylık)</button>
      </div>
      <div class="error" id="renewErr" style="text-align:left;margin-top:8px;"></div>
    </div>`;
}
async function startRenewal(){
  const session = getSession();
  const btn = document.getElementById('renewBtn');
  const errBox = document.getElementById('renewErr');
  errBox.textContent = '';
  btn.disabled = true; btn.textContent = 'Yönlendiriliyor...';
  try{
    const res = await fetch(PAYMENT_RENEW_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: session.session_token })
    });
    const data = await res.json();
    if(!res.ok || !data.paymentPageUrl){
      errBox.textContent = 'Ödeme başlatılamadı: ' + (data.errorMessage || JSON.stringify(data));
      btn.disabled = false; btn.textContent = '💳 Öde / Yenile (Aylık)';
      return;
    }
    window.location.href = data.paymentPageUrl;
  }catch(err){
    errBox.textContent = 'Ödeme sayfasına ulaşılamadı: ' + err.message;
    btn.disabled = false; btn.textContent = '💳 Öde / Yenile (Aylık)';
  }
}

async function saveUser(id){
  const session = getSession();
  const username = document.getElementById('us_name_'+id).value.trim();
  const password = document.getElementById('us_pass_'+id).value;
  const role = document.getElementById('us_role_'+id).value;
  const { error } = await sb.rpc('update_staff_user', { p_token: session.session_token, p_user_id: id, p_username: username, p_password: password||null, p_role: role });
  if(error){ alert(error.message); return; }
  renderSettingsView(document.getElementById('main'), session);
  showToast('Kaydedildi ✓');
}
async function addUser(){
  const session = getSession();
  const username = document.getElementById('nu_name').value.trim();
  const password = document.getElementById('nu_pass').value;
  const role = document.getElementById('nu_role').value;
  if(!username || !password) return;
  const { error } = await sb.rpc('create_staff_user', { p_token: session.session_token, p_username: username, p_password: password, p_role: role });
  if(error){ alert(error.message); return; }
  renderSettingsView(document.getElementById('main'), session);
}
async function removeUser(id){
  if(!confirm('Bu kullanıcıyı silmek istediğinize emin misiniz?')) return;
  const session = getSession();
  const { error } = await sb.rpc('delete_staff_user', { p_token: session.session_token, p_user_id: id });
  if(error){ alert(error.message); return; }
  renderSettingsView(document.getElementById('main'), session);
}

/* ================= FİNANSAL ANALİZ ================= */
async function renderReportsView(main, session){
  main.innerHTML = `<h1>Finansal Analiz</h1>
    <div class="box" style="max-width:none;display:flex;justify-content:space-between;align-items:center;">
      <span class="muted">Tarih Seç</span>
      <input type="date" id="reportDateInput" value="${APP.reportDate}" onchange="changeReportDate(this.value)">
    </div>
    <div id="reportContent"><p class="muted">Yükleniyor...</p></div>`;
  await renderReportContent(session);
}
function changeReportDate(v){ APP.reportDate = v; renderReportContent(getSession()); }
async function renderReportContent(session){
  const el = document.getElementById('reportContent'); if(!el) return;
  const { data, error } = await sb.rpc('get_sales_history', { p_token: session.session_token, p_date: APP.reportDate });
  if(error){ el.innerHTML = '<p class="muted">Yüklenemedi: '+error.message+'</p>'; return; }
  const hist = data || [];

  let totalRevenue=0, totalCost=0, totalCash=0, totalCard=0, totalDiscount=0, discountedCount=0;
  const hourStats = {};
  hist.forEach(o => {
    totalRevenue += Number(o.total); totalCost += Number(o.cost);
    totalCash += Number(o.cash_amount||0); totalCard += Number(o.card_amount||0);
    totalDiscount += Number(o.discount_amount||0);
    if(o.discount_amount>0) discountedCount++;
    const hr = new Date(o.closed_at).getHours();
    if(!hourStats[hr]) hourStats[hr] = {count:0, revenue:0};
    hourStats[hr].count += 1;
    hourStats[hr].revenue += Number(o.total);
  });
  const profit = totalRevenue - totalCost;

  const hourKeys = Object.keys(hourStats).map(Number).sort((a,b)=>a-b);
  let peakHour = null;
  hourKeys.forEach(h => { if(peakHour===null || hourStats[h].count>hourStats[peakHour].count) peakHour=h; });
  const maxCount = hourKeys.length ? Math.max(...hourKeys.map(h=>hourStats[h].count)) : 0;
  const hourlyHtml = hourKeys.length===0 ? '<p class="muted">Bu tarihte veri yok.</p>' :
    `<table style="width:100%;border-collapse:collapse;"><thead><tr style="text-align:left;color:var(--muted);font-size:12px;"><th>Saat</th><th>Sipariş</th><th>Ciro</th><th>Yoğunluk</th></tr></thead><tbody>` +
    hourKeys.map(h => {
      const hs = hourStats[h];
      const pct = maxCount ? Math.round(hs.count/maxCount*100) : 0;
      const isPeak = h===peakHour;
      const label = (h<10?'0'+h:h)+':00-'+((h+1)%24<10?'0'+((h+1)%24):(h+1)%24)+':00';
      return `<tr style="${isPeak?'background:rgba(255,122,69,.08);':''}"><td style="padding:6px 4px;border-top:1px solid var(--border);">${label}${isPeak?' 🔥':''}</td>
        <td style="padding:6px 4px;border-top:1px solid var(--border);">${hs.count}</td>
        <td style="padding:6px 4px;border-top:1px solid var(--border);">${money(hs.revenue)}</td>
        <td style="padding:6px 4px;border-top:1px solid var(--border);"><div style="background:var(--panel2);border-radius:6px;height:14px;min-width:70px;overflow:hidden;"><div style="width:${pct}%;height:100%;background:${isPeak?'var(--accent)':'var(--accent2)'};"></div></div></td></tr>`;
    }).join('') + '</tbody></table>';

  const billsHtml = hist.length===0 ? '<p class="muted">Bu tarihte kapatılmış hesap yok.</p>' :
    `<table style="width:100%;border-collapse:collapse;"><thead><tr style="text-align:left;color:var(--muted);font-size:12px;"><th>Saat</th><th>Masa</th><th>Tutar</th><th>İndirim</th><th>Ödeme</th></tr></thead><tbody>` +
    hist.map(o => {
      const t = new Date(o.closed_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
      const methodLabel = {cash:'Nakit', card:'Kredi Kartı'}[o.payment_method] || o.payment_method;
      const discTxt = o.discount_amount>0 ? ('-'+money(o.discount_amount)) : '-';
      return `<tr><td style="padding:6px 4px;border-top:1px solid var(--border);">${t}</td>
        <td style="padding:6px 4px;border-top:1px solid var(--border);">${escapeHtml(o.table_name||'')}</td>
        <td style="padding:6px 4px;border-top:1px solid var(--border);">${money(o.total)}</td>
        <td style="padding:6px 4px;border-top:1px solid var(--border);">${discTxt}</td>
        <td style="padding:6px 4px;border-top:1px solid var(--border);">${methodLabel}</td></tr>`;
    }).join('') + '</tbody></table>';

  el.innerHTML = `
    <div class="home-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));">
      <div class="box" style="text-align:center;"><div style="font-size:22px;font-weight:800;">${hist.length}</div><div class="muted" style="font-size:12px;">Kapatılan Hesap</div></div>
      <div class="box" style="text-align:center;"><div style="font-size:22px;font-weight:800;">${money(totalRevenue)}</div><div class="muted" style="font-size:12px;">Toplam Ciro</div></div>
      <div class="box" style="text-align:center;"><div style="font-size:22px;font-weight:800;">${money(totalCost)}</div><div class="muted" style="font-size:12px;">Toplam Maliyet</div></div>
      <div class="box" style="text-align:center;"><div style="font-size:22px;font-weight:800;color:${profit>=0?'var(--green)':'var(--red)'};">${money(profit)}</div><div class="muted" style="font-size:12px;">Net Kâr</div></div>
    </div>
    <div class="home-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));">
      <div class="box" style="text-align:center;"><div style="font-size:20px;font-weight:800;color:var(--green);">${money(totalCash)}</div><div class="muted" style="font-size:12px;">💵 Nakit${totalRevenue?' ('+Math.round(totalCash/totalRevenue*100)+'%)':''}</div></div>
      <div class="box" style="text-align:center;"><div style="font-size:20px;font-weight:800;color:var(--accent2);">${money(totalCard)}</div><div class="muted" style="font-size:12px;">💳 Kredi Kartı${totalRevenue?' ('+Math.round(totalCard/totalRevenue*100)+'%)':''}</div></div>
      <div class="box" style="text-align:center;"><div style="font-size:20px;font-weight:800;color:var(--accent);">${money(totalDiscount)}</div><div class="muted" style="font-size:12px;">🏷️ İndirim (${discountedCount} hesap)</div></div>
    </div>
    <div class="box" style="max-width:none;"><h2>Saatlik Yoğunluk${peakHour!==null?' <span class="muted" style="font-size:12px;font-weight:400;">(en yoğun: '+(peakHour<10?'0'+peakHour:peakHour)+':00 🔥)</span>':''}</h2>${hourlyHtml}</div>
    <div class="box" style="max-width:none;"><h2>Kapatılan Hesaplar</h2>${billsHtml}</div>
  `;
}

render();
</script>
